name: android

# NOTES-FROM-PLANNING.md entry 198 section 2.6: an APK on every push to main that touches the engine or the Android code. Entry 219
# item A3: the application itself, org.grouplab.app, and beside it the spike, which carries the camera until item A4 moves it into the
# application, because request 33 installs it. Unsigned debug builds only, kept as a workflow artifact for fourteen days; nothing here is ever published as a nightly or a
# release, and nothing here runs the nightly. A signed release APK and AAB wait for the upload key (entry 198 section 3.3).

on:
  push:
    branches: [main]
    paths:
      - 'src/GroupLab.Core/**'
      - 'src/GroupLab.Cli/Imaging/**'
      - 'src/GroupLab.App/AppSettings.cs'
      - 'src/GroupLab.App/SharingWords.cs'
      - 'src/GroupLab.App/Diagnostics/**'
      - 'targets/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: OpenCV for android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The build takes most of an hour and depends only on the script, which pins every version, so it is kept until the script changes.
      - name: Native library cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-native
          key: android-native-${{ hashFiles('android/opencv/build-extern.sh') }}

      - name: Build OpenCV and OpenCvSharp's native half
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash android/opencv/build-extern.sh "${{ runner.temp }}/android-native-work" "${{ runner.temp }}/android-native"

      - uses: actions/upload-artifact@v6
        with:
          name: android-native
          path: ${{ runner.temp }}/android-native
          retention-days: 14

  apk:
    name: APKs
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: The .NET Android workload
        run: dotnet workload install android --skip-sign-check > /dev/null

      - uses: actions/download-artifact@v5
        with:
          name: android-native
          path: android/native

      - name: Build
        # Release, signed with the build machine's debug key: a Debug APK expects Visual Studio's fast deployment and does not start on
        # its own (entry 202), and this one is what Alan installs by hand (entry 219 item A2).
        run: |
          dotnet build android/GroupLab.Android --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64"
          dotnet build android/GroupLab.Android.Spike --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64"

      - name: What the APKs carry
        run: |
          apk=$(find android/GroupLab.Android/bin/Release -name 'org.grouplab.app-Signed.apk' | head -1)
          test -n "$apk"
          ls -l "$apk"
          for item in lib/arm64-v8a/libOpenCvSharpExtern.so assets/targets/GL-CF25-LTR.gltd.json; do
            unzip -l "$apk" | grep -q " $item$" || { echo "the application's APK does not carry $item"; exit 1; }
          done
          mkdir -p apk && cp "$apk" apk/grouplab.apk
          apk=$(find android/GroupLab.Android.Spike/bin/Release -name '*-Signed.apk' | head -1)
          test -n "$apk"
          ls -l "$apk"
          # Each one on its own: a grep for any of them passed on 3c3fa98 with the sheets in the wrong place.
          for item in lib/arm64-v8a/libOpenCvSharpExtern.so assets/targets/GL-CF25-LTR.gltd.json assets/images/gl-cf25-ltr-d-25-shots-600-dpi.png; do
            unzip -l "$apk" | grep -q " $item$" || { echo "the APK does not carry $item"; exit 1; }
          done
          mkdir -p apk && cp "$apk" apk/grouplab-spike.apk

      - uses: actions/upload-artifact@v6
        with:
          name: grouplab-apk
          path: apk/grouplab.apk
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: grouplab-spike-apk
          path: apk/grouplab-spike.apk
          retention-days: 14
