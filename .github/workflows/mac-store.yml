name: mac app store

# NOTES-FROM-PLANNING.md entry 501: GroupLab for Mac on the Mac App Store, as far as TestFlight's internal group; submission waits on Alan's
# word. After each nightly, the desktop application is built again as the store copy (GroupLabDistribution=store, so its own updater is
# off, and bundle identifier org.grouplab.app, the iPhone and iPad app's, for one App Store record) and checked inside Apple's App Sandbox:
# signed ad hoc with the sandbox's entitlements, it runs --self-check, which reads and analyzes a sample sheet, saves a session and makes
# and follows a bookmark, all inside its container. Once request 107's secrets exist it is also signed for the store with the Apple
# Distribution certificate, packaged as an installer signed with the Mac Installer Distribution certificate, and sent to TestFlight. Until
# then it says so and sends nothing. The Developer ID download (package.yml) is not touched.

on:
  workflow_run:
    workflows: [nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The nightly to build, such as v1.0.0-nightly.232. Empty takes the newest.'
        required: false
        default: ''
        type: string
      ref:
        description: 'A commit to build instead of the nightly itself, named as the nightly above; for proving a change before the next nightly. Never sent to TestFlight.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mac-app-store
  cancel-in-progress: false

jobs:
  store:
    name: the Mac App Store copy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Which nightly
        id: which
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag=$(gh api "repos/${{ github.repository }}/tags?per_page=100" --jq '.[] | select(.commit.sha == "${{ github.event.workflow_run.head_sha }}") | .name' | grep '^v' | head -1 || true)
          fi
          if [ -z "$tag" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag=$(gh release list -R "${{ github.repository }}" --limit 20 --json tagName --jq '.[].tagName' | grep '^v' | head -1)
          fi
          if [ -z "$tag" ]; then
            echo "### The Mac App Store copy: this nightly run made no build, so there is nothing to make." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${version##*.}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.which.outputs.tag != ''
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || steps.which.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        if: steps.which.outputs.tag != ''
        with:
          dotnet-version: '10.0.x'

      - name: Publish the store copy
        if: steps.which.outputs.tag != ''
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/GroupLab.App --configuration Release -r osx-arm64 --self-contained -o publish/grouplab \
            "-p:Version=${{ steps.which.outputs.version }}" -p:GroupLabTrain=nightly -p:GroupLabDistribution=store
          cp LICENSE THIRD-PARTY-NOTICES.md publish/grouplab/

      # Entry 501, found 2026-11-18: signed ad hoc, the sandbox refuses the copy its connection to LaunchServices on GitHub's Mac machines
      # and AppKit stops it ("unable to get application ASN from launchservicesd"), and a copy signed for the store runs only once installed
      # from TestFlight. So this step says what happened in the summary without turning the run red until the copy can be signed for
      # development or installed on a real Mac (docs/MAC-APP-STORE.md); the signing and upload below do not depend on it.
      - name: Check it inside the sandbox
        if: steps.which.outputs.tag != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/GroupLab.App/SelfCheck.cs ]; then
            echo "### The Mac App Store copy: ${{ steps.which.outputs.tag }} was built before the self-check existed, so it is not run in the sandbox." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/macos-bundle.py publish/grouplab out/check --version "${{ steps.which.outputs.version }}" --arch macos-arm64 --store-build "${{ steps.which.outputs.build }}"
          app=out/check/GroupLab.app
          # The sandbox's own keys, without the team's identifiers, which only a store signature may carry. Signed ad hoc and without the
          # hardened runtime, so libraries signed ad hoc load; the store signature below is the hardened one.
          python3 - <<'PY'
          import plistlib
          e = plistlib.load(open("scripts/macos/GroupLab.store.entitlements", "rb"))
          for k in ("com.apple.application-identifier", "com.apple.developer.team-identifier"):
              e.pop(k, None)
          plistlib.dump(e, open("out/sandbox-only.entitlements", "wb"))
          PY
          main="$app/Contents/MacOS/GroupLab.App"
          # As package.yml signs the download: every file in Contents/MacOS is code to codesign, the .NET libraries included, and a
          # Mach-O file anywhere else.
          find "$app/Contents" -type f | while read -r f; do
            [ "$f" = "$main" ] && continue
            case "$f" in "$app/Contents/MacOS/"*) codesign --force --sign - "$f" ;; *) if file "$f" | grep -q "Mach-O"; then codesign --force --sign - "$f"; fi ;; esac
          done
          codesign --force --sign - --entitlements out/sandbox-only.entitlements "$app"
          codesign --display --entitlements - "$app" | grep -q app-sandbox || { echo "::error::the sandbox entitlement is not on the bundle"; exit 1; }
          # Started the way a double click starts it, through LaunchServices, which sets the sandbox up; its output goes to files.
          set +e
          ( open -W -n --stdout "$PWD/out/self-check.out" --stderr "$PWD/out/self-check.err" "$app" --args --self-check ) &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          if kill -0 $pid 2>/dev/null; then kill $pid; pkill -f "GroupLab.App --self-check"; echo "::error::the self-check did not finish in ten minutes"; tail -40 out/self-check.out out/self-check.err; exit 1; fi
          wait $pid
          code=$?
          set -e
          why() {
            tail -40 out/self-check.out out/self-check.err 2>/dev/null || true
            log show --last 5m --style compact --predicate 'process == "GroupLab.App" OR (sender == "Sandbox" AND eventMessage CONTAINS "GroupLab")' 2>/dev/null | tail -40 || true
            for f in "$HOME"/Library/Logs/DiagnosticReports/*GroupLab*; do [ -f "$f" ] && head -80 "$f"; done
          }
          result="$HOME/Library/Containers/org.grouplab.app/Data/.config/GroupLab/self-check.json"
          { echo "### The Mac App Store copy, ${{ steps.which.outputs.tag }}, inside the sandbox: exit $code"; echo '```'; cat "$result" 2>/dev/null || tail -40 out/self-check.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test -f "$result" || { echo "::error::no self-check.json in the container, so the copy did not run inside the sandbox"; why; exit 1; }
          cat "$result"
          grep -q '"ok": true' "$result" || { echo "::error::a step of the self-check failed; the summary says which"; why; exit 1; }

      - name: The store secrets
        id: secrets
        if: steps.which.outputs.tag != ''
        shell: bash
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_STORE_PROFILE: ${{ secrets.MACOS_STORE_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in IOS_DIST_CERT_P12 MACOS_INSTALLER_CERT_P12 MACOS_STORE_PROFILE APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "### The Mac App Store copy is not signed or sent to TestFlight: request 107's secrets are not all there yet (missing:$missing)." >> "$GITHUB_STEP_SUMMARY"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign for the store and send to TestFlight
        if: steps.which.outputs.tag != '' && steps.secrets.outputs.sign == 'true' && inputs.ref == ''
        shell: bash
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_STORE_PROFILE: ${{ secrets.MACOS_STORE_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$MACOS_STORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/store.provisionprofile"
          python3 scripts/macos-bundle.py publish/grouplab out/store --version "${{ steps.which.outputs.version }}" --arch macos-arm64 \
            --store-build "${{ steps.which.outputs.build }}" --profile "$RUNNER_TEMP/store.provisionprofile"
          rm -f "$RUNNER_TEMP/store.provisionprofile"
          app=out/store/GroupLab.app
          sed "s/TEAM_ID/$APPLE_TEAM_ID/g" scripts/macos/GroupLab.store.entitlements > "$RUNNER_TEMP/store.entitlements"

          keychain="$RUNNER_TEMP/store.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$MACOS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Apple Distribution" | head -1 | awk '{print $2}')
          installer=$(security find-identity -v "$keychain" | grep -E "Mac Installer Distribution|3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          test -n "$identity" || { echo "::error::IOS_DIST_CERT_P12 is not an Apple Distribution certificate"; exit 1; }
          test -n "$installer" || { echo "::error::MACOS_INSTALLER_CERT_P12 is not a Mac Installer Distribution certificate"; exit 1; }

          main="$app/Contents/MacOS/GroupLab.App"
          find "$app/Contents" -type f | while read -r f; do
            [ "$f" = "$main" ] && continue
            case "$f" in
              "$app/Contents/MacOS/"*) codesign --force --options runtime --sign "$identity" "$f" ;;
              *) if file "$f" | grep -q "Mach-O"; then codesign --force --options runtime --sign "$identity" "$f"; fi ;;
            esac
          done
          codesign --force --options runtime --entitlements "$RUNNER_TEMP/store.entitlements" --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          productbuild --component "$app" /Applications --sign "$installer" out/GroupLab.pkg

          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          if xcrun altool --upload-app --type macos --file out/GroupLab.pkg --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" > upload.log 2>&1; then
            echo "### The Mac App Store copy, build ${{ steps.which.outputs.build }}, signed and sent to TestFlight (internal group only; nothing submitted for review)." >> "$GITHUB_STEP_SUMMARY"
          else
            grep -vi "key" upload.log | tail -30
            echo "::error::TestFlight did not take the Mac build; the lines above say why."
            rm -rf "$HOME/private_keys"
            exit 1
          fi
          rm -rf "$HOME/private_keys"
          security delete-keychain "$keychain"
