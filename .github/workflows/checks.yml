# The checks no nightly waits for, NOTES-FROM-PLANNING.md entry 452. They were jobs in ci.yml ("build and test"), and the nightly starts
# only when that whole run succeeds, so 11 nightlies since 2026-09-28 were lost to the website job and one to the ships list, with every
# application build fine. They still run on every push and pull request and still fail where they should, under the same names, and the
# site's own publish (website.yml) still has its own gate; they just no longer decide whether GroupLab is built.
#
# - website builds: the site, its claims, the README and the receiver's PHP, as before.
# - ships list: whether the list of what ships is the list the build reads (entry 168 section 2.5). That list decides whether a nightly is
#   built; it is not what the Linux download contains, which ci.yml's linux tarball still checks and gates.
# - release notes: every Release-note trailer pushed since the newest nightly, by the nightly's own checker (entry 452 section 3), so a
#   note that would be refused is red on its own commit instead of costing a nightly.
name: checks no nightly waits for

on:
  push:
    branches-ignore: ['ios/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: website builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The builder's packages
        run: python -m pip install --quiet markdown Pillow fonttools brotli

      # NOTES-FROM-PLANNING.md entry 128 section 2. This only builds. It never publishes, uploads or touches a release: publishing the site
      # is website.yml, which a person starts by hand and nothing else may start. Building it here means a change that breaks the site is
      # caught on the push that broke it rather than the next time somebody tries to publish.
      #
      # The builder's own checks run with it: no em dash, no banned term, nothing that looks like an address, no link to releases/latest or
      # v0.1.0, and the download buttons pointing at the rolling nightly's stable names.
      - name: Build the site
        run: python website/build.py

      # NOTES-FROM-PLANNING.md entry 462 section 1: every built page through axe-core in a real browser, light and dark, at a phone's width
      # (WCAG 2.1 A and AA, contrast included). A finding fails the push that made it; the few that wait on a look decision sent to Alan are
      # listed in website/a11y-pending.json and printed as waiting. The runner's own Chrome is used, so nothing is downloaded but two packages.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Every page passes the accessibility check
        run: |
          mkdir -p "$RUNNER_TEMP/a11y" && cd "$RUNNER_TEMP/a11y" && npm init -y >/dev/null
          npm install --no-audit --no-fund --silent playwright-core@1.48.2 @axe-core/playwright@4.10.1
          cd "$GITHUB_WORKSPACE" && NODE_PATH="$RUNNER_TEMP/a11y/node_modules" node scripts/site-audit.cjs --only a11y

      # NOTES-FROM-PLANNING.md entry 267: the weekly consistency audit's checks, offline and as warnings, so a drift shows on the push that
      # made it; the weekly job (consistency.yml) adds the network checks and keeps the issue.
      - name: The consistency audit, as warnings
        run: python scripts/consistency.py --warn --offline

      # NOTES-FROM-PLANNING.md entry 435 section 1: the guide PDFs' check above only warned, and the user guide's PDF fell three commits
      # behind its guide while the site served it. This one fails.
      - name: The guide PDFs are made from their guides
        run: python scripts/consistency.py --guides

      # NOTES-FROM-PLANNING.md entry 159 section 5.4: every checkable sentence the built site, the README and the documents publish has its
      # backing in docs/claims-backing.json, read one sentence at a time or classified by a rule that says what the document is. A new or
      # changed sentence with nothing behind it fails here, which is what makes the audit worth doing once.
      - name: Every published claim is backed
        run: python scripts/claims.py --check

      # NOTES-FROM-PLANNING.md entry 130 section 2.1. The receivers are PHP and run on a public web server, where a typo is a 500 for
      # everybody who tries to send a photograph and nothing in the logs a person would think to look at. The Linux runner has PHP, so the
      # syntax is checked here, on every push, before it can reach the server. Nothing runs the files: php -l parses and stops.
      - name: Every PHP file must parse
        run: |
          set -o pipefail
          found=0
          failed=0
          while IFS= read -r file; do
            found=$((found + 1))
            if ! php -l "$file"; then
              failed=$((failed + 1))
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './website/_site/*')
          echo "$found PHP files checked, $failed with errors"
          test "$failed" -eq 0

      # NOTES-FROM-PLANNING.md entry 129 section 8.1: the receiver refuses what it should, with no network. Parsing says only that the
      # file is PHP; this runs it, against a temporary tree that goes when the run ends, with Cloudflare's siteverify faked by a
      # file:// URL so nothing leaves the runner. It covers a good submission, each refused type, the size and count limits, the
      # honeypot, consent, every way a Turnstile token can fail, and the rate limit.
      - name: The receiver refuses what it should
        run: php tests/php/receiver-tests.php

      # Entry 174: the checks above build $_FILES themselves, so they could not see that the page's file input needed a name ending in
      # [] for PHP to build the per-file arrays, and every real submission was refused. This serves the receiver with PHP's own server and
      # sends it a real multipart POST built from the page's field name, one file and two, so PHP's parsing is what is tested.
      - name: The receiver takes what the real form sends
        run: php tests/php/multipart-tests.php

      # Entry 147 section 3.2: the platform statement is generated into README.md from docs/PLATFORM-SUPPORT.md. A person editing the
      # README by hand between the markers would leave two versions of what the project promises about macOS, and no way to tell which
      # is the real one. This says so at the time rather than months later.
      - name: The README carries the current platform statement
        run: python3 scripts/platform-support.py --check

      # Entry 244: the README's generated sections match their sources, and a feature of kind "new" that has landed since the prose last
      # changed is named somewhere, or the prose is due a visit. The nudge reads the history, hence the full checkout above.
      - name: The README is current
        run: python3 scripts/readme.py --check

      - name: Say what it made
        run: |
          {
            echo "### website"
            echo
            echo "- $(find website/_site -type f | wc -l) files, $(du -sh website/_site | cut -f1)"
            echo "- built from ${GITHUB_SHA:0:7}, and published by nothing"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ships-list:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: ships list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # NOTES-FROM-PLANNING.md entry 168 section 2.5: the nightly's gate decides whether a release is built from a list of what ships,
      # and that list is generated from what MSBuild says the published application reads. Regenerated here and compared, so a new source
      # file or embedded resource cannot be added without the gate knowing, and a test or a script cannot quietly start producing releases.
      - name: The ships list is what the build reads
        run: python3 scripts/shipping-gate.py --check-generated

  release-notes:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Every note since the newest nightly can be published
        run: |
          git fetch --quiet --tags origin 2>/dev/null || true
          python3 scripts/release-notes.py --check HEAD
