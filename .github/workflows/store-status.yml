name: store status

# Request 38 Part B: the first Store submission went to Microsoft's certification on 2026-09-30. This reads, and never changes, where the
# Store's submissions stand, so the result shows in the run's summary without anybody opening Partner Center. It uses the same read-only
# login check release.yml runs first.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
      CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      PRODUCT: ${{ vars.STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the Store's submissions
        shell: pwsh
        run: ./scripts/store-login-check.ps1
        env:
          STATUS_OUT: state-lines.txt

      # Entry 369 section 3: whether the Store's search finds GroupLab by name, recorded when it changes; after eight days of not, the text
      # of a support ticket for Alan at the top of for-alan.md.
      - name: Search the Store for GroupLab
        if: always()
        shell: bash
        run: |
          python3 scripts/store-follow.py search > search-lines.txt || true
          python3 scripts/status-note.py --section store-search < search-lines.txt > search-said.txt || true
          if ! grep -q '^changed' search-said.txt && git diff --quiet -- docs/notes/for-alan.md docs/notes/store-follow.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notes/external-status.md docs/notes/for-alan.md docs/notes/store-follow.json
          git diff --cached --quiet && exit 0
          git commit -m "[notes] External status: the Store's search" -m "Written by the store status workflow, entry 369."
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done

      # Entries 335 and 336: a state that changed goes to docs/notes/external-status.md, which both sessions read, as a "[notes] " commit
      # that starts no build. The same state again writes nothing.
      - name: Note a changed state
        if: always()
        shell: bash
        run: |
          [ -f state-lines.txt ] || exit 0
          grep -v '^::' state-lines.txt | grep -v 'Run it again' | python3 scripts/status-note.py --section store > said.txt
          if ! grep -q '^changed' said.txt; then echo "the state is as it was"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notes/external-status.md
          git commit -m "[notes] External status: store changed" -m "Written by the store status workflow, entries 335 and 336."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::the changed state could not be pushed; the next run tries again"
