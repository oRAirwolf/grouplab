# Build and test on every push and pull request, on all three desktop platforms (NOTES-FROM-PLANNING.md entries 31 section 3, 32 section 4
# and 33 section 3). All three are required: Linux and macOS were allowed to fail until they passed, which they did on the first run, with
# the same test counts as Windows (docs/PHASE1-RESULTS.md "Entry 33"). Each job writes its test counts to the run summary, because
# building and agreeing on the numbers are different claims.
name: build and test

on:
  push:
  pull_request:

# Entry 141 section 2.2: a newer push cancels the older run on the same branch. Two pushes a few minutes apart used to build the same code
# twice over, and on 2026-09-22 a windows runner was lost after 52 minutes on a run that a later push had already made pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Entry 144 section 2.2: the nightly's own release-notes commit must not start another full test run, or every
    # nightly would cause one and each would cause another nightly. The marker is in the commit subject and nothing else
    # writes it. An ordinary commit has no marker and runs everything, which the entry asks to be proved both ways round.
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: ${{ matrix.os }}
    # Entry 185 section 2: the test data comes from the job that can read the release as a draft, as an artifact.
    needs: test-data-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # NOTES-FROM-PLANNING.md entry 107 section 2: find out whether the runner can print to "Microsoft Print to PDF" rather than guess. The
      # printed-size test runs where it is installed and is skipped with the reason named where it is not; this puts the answer in the summary.
      - name: Installed printers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $printers = @(Get-Printer -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          $printers | ForEach-Object { Write-Output $_ }
          $pdf = if ($printers -contains 'Microsoft Print to PDF') { 'installed, so the printed-size test runs' } else { 'not installed, so the printed-size test is skipped' }
          "### installed printers`n`n- $($printers.Count) printers: $($printers -join ', ')`n- Microsoft Print to PDF: $pdf" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      # NOTES-FROM-PLANNING.md entry 110 section 2f: ballistics.js is run again under Node on every push, and its output must be the fixture the
      # transcription test reads, so the test is always against the original, unchanged file (docs/BALLISTICS-VALIDATION.md section 1).
      - name: ballistics.js output unchanged
        if: runner.os == 'Linux'
        run: |
          node --version
          node reference/ballistics-js/cases.js > "$RUNNER_TEMP/ballistics-js.json"
          diff -u tests/GroupLab.Core.Tests/Fixtures/ballistics-js.json "$RUNNER_TEMP/ballistics-js.json"

      # NOTES-FROM-PLANNING.md entry 115 section 6: the corrected ballistics.js is run under Node and held to GroupLab's own solver by
      # CorrectedJavaScriptTests, which reads this file. It is written here rather than committed, so the check is always against the
      # JavaScript as it stands rather than a stale copy of its output.
      - name: corrected ballistics.js rows
        run: |
          node --version
          node reference/ballistics-js/cases.corrected.js > tests/GroupLab.Core.Tests/Fixtures/ballistics-js-corrected.json

      - name: Build
        run: dotnet build GroupLab.slnx --configuration Release

      # NOTES-FROM-PLANNING.md entry 171 section 6: files over about 10 MB are downloads on the test-data release, never in the
      # repository. Entry 185 section 2: the release is kept off the public releases page as a draft, which only a token that can write
      # contents can see, so the one job holding that fetches the files, verifies each SHA-256 and hands them here as an artifact. A file
      # not there is named in that job's log, and the tests that need it skip and say so.
      - name: Test data
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: test-data
          path: ${{ runner.temp }}/test-data

      - name: Where the test data is
        run: echo "GROUPLAB_TEST_DATA=$RUNNER_TEMP/test-data" >> "$GITHUB_ENV"

      # NOTES-FROM-PLANNING.md entry 179: the suite must leave nothing in the temporary directory. Each test process writes into its own
      # folder and removes it (tests/Shared/TestTempRoot.cs), and dotnet test itself, which makes two empty randomly named folders on every
      # run before any test starts, is given a folder of its own that is removed afterwards. The check after the suite fails on anything left.
      - name: What the temporary directory holds before the suite
        run: $(command -v python3 || command -v python) scripts/temp-leak-check.py snapshot

      - name: Test
        run: |
          set -o pipefail
          status=0
          runner_temp="$RUNNER_TEMP/grouplab-dotnet-test"
          mkdir -p "$runner_temp"
          for project in tests/GroupLab.Core.Tests tests/GroupLab.App.Tests; do
            TMP="$runner_temp" TEMP="$runner_temp" TMPDIR="$runner_temp" dotnet test "$project" --configuration Release --no-build 2>&1 | tee -a test-output.txt || status=1
          done
          rm -rf "$runner_temp"
          exit $status

      - name: The suite left nothing in the temporary directory
        if: always()
        run: $(command -v python3 || command -v python) scripts/temp-leak-check.py check

      # NOTES-FROM-PLANNING.md entry 117 section 3: CI reports the benchmark and does not gate it, because runner speed varies between runs
      # and between machines. The committed record in docs/PERFORMANCE.md is measured on Alan's own desktop; this figure is for information,
      # exactly as the raw gate records are. One run of each case, on Linux only, so a push pays for it once.
      - name: Benchmark, reported and not gated
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- bench --runs 1 | tee bench.txt
          {
            echo "### benchmark on this runner, for information"
            echo
            echo "Not a gate. The committed record is measured on one desktop; this says what a runner does with the same cases."
            echo
            echo '```'
            tail -n +4 bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Entry 220: the archive scripts under Windows PowerShell 5.1, which Alan's shell runs, and PowerShell 7, against a stand-in gh that
      # talks on stderr as the real one does. Request 31's first pull stopped on exactly that, and no test ran the scripts before.
      - name: The archive scripts, Windows PowerShell 5.1 and PowerShell 7
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/powershell/archive-tests.ps1
          pwsh -NoProfile -File tests/powershell/archive-tests.ps1

      - name: Test counts
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            if [ -f test-output.txt ]; then
              grep -E "Passed!|Failed!" test-output.txt | sed 's/^/- /' || echo "- no test summary was produced"
            else
              echo "- the tests did not run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # NOTES-FROM-PLANNING.md entry 61 sections 1 and 5 item 2: one Linux format, the self-contained tarball, because it falls out of a build
  # that already happens and costs nothing to keep. AppImage if somebody wants a menu entry; .deb, .rpm, snap and flatpak when a person asks
  # for one by name, because each is a permanent obligation and there are no Linux users yet.
  #
  # Built on Linux rather than cross-published, because src/GroupLab.Cli/GroupLab.Cli.csproj references the OpenCV native runtime package
  # for the build host's own platform, so only a Linux host puts the Linux native library in the output.
  #
  # Entry 63 section 2: the build host sets the floor. A binary built against an older glibc runs on a newer one and not the other way, so
  # this tarball runs on the runner's distribution and newer, and proving it on a newer release would prove nothing about an older one.
  # ubuntu-latest is Ubuntu 24.04 today, which is also what the test matrix and the gate record run on. The day ubuntu-latest moves to 26.04
  # the floor moves with it and nothing here will say so, which is why the step prints the release and the glibc version it built against.
  #
  # The application reads the system region on first run (InvariantGlobalization is false, see src/GroupLab.App/GroupLab.App.csproj), so the
  # machine that unpacks this needs ICU. Every desktop Ubuntu has it; a minimal container may not.
  # NOTES-FROM-PLANNING.md entry 116 section 1: the zip is what the automated checks produce, so it is built on every push and kept as an
  # artifact for 30 days, beside the Linux tarball. This job publishes nothing and exists to fail the build when packaging breaks, which is
  # why it is here and not in package.yml: entry 119's test-build.yml runs after this workflow succeeds, so a packaging fault caught here is
  # caught before anything reaches a download. The packaging script checks the package carries its own runtime and its OpenCV native
  # library by analysing its own sample with its own grouplab.exe, so a package that cannot analyse fails the build rather than a person.
  # NOTES-FROM-PLANNING.md entry 176 section 7: the intake worker run for real, with a real ClamAV daemon and clamdscan, under the same
  # systemd memory limit as the server, on the Ubuntu release the server runs. The worker was killed for memory on every run once real
  # submissions arrived, and nothing had caught it because no test had ever run the scanner.
  intake-worker:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: The server's packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav-daemon clamdscan libheif-examples libheif-plugin-libde265 libheif-plugin-x265 python3-pil
          # Entry 183: the receiver runs too, so the consent test follows a submission from the form's own receiver to the pull script.
          sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring
          # The packaged services start on install; the test runs its own clamd with its own signature instead.
          sudo systemctl stop clamav-daemon clamav-freshclam || true

      - name: The worker, run for real
        run: python3 tests/python/worker-tests.py

      # Entry 194: the error worker against a GitHub that answers from the test itself, so nothing leaves the runner.
      - name: The error worker, against a stand-in GitHub
        run: python3 tests/python/error-worker-tests.py

      # Entries 207 and 208: the survey worker counts reports into an aggregate and publishes nothing smaller than ten.
      - name: The survey worker
        run: python3 tests/python/survey-worker-tests.py

      # Entry 222: the nightly backup's rules for what it keeps and what it may never read.
      - name: The backup's rules
        run: python3 tests/python/backup-tests.py

      # Entry 222 section 2: the server's archive worker against a stand-in GitHub, so nothing leaves the runner.
      - name: The archive worker, against a stand-in GitHub
        run: python3 tests/python/archive-worker-tests.py

  # Entry 171 section 6: the release the large test files hang from, created once by the workflow that uses them rather than by the
  # nightly, so nothing that prunes or rewrites nightly releases can reach it. It is a pre-release that is never latest, so GitHub's
  # releases/latest and the update manifest never see it. Creating it is the whole job; files are attached to it by hand, each with its
  # consent record committed first.
  test-data-release:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The test-data release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only a push to main creates it; a pull request or a branch run has nothing to do here.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "not a push to main, so the release is left alone"
            exit 0
          fi
          if gh release view test-data >/dev/null 2>&1; then
            echo "test-data release already exists"
          else
            gh release create test-data --draft --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Test data, not a build" \
              --notes "Large files the tests read, kept out of the repository so no clone carries them. Nothing here is GroupLab. Each file is listed with its SHA-256 in tests/test-data.json and its consent in samples/PROVENANCE.md. Created by ci.yml, NOTES-FROM-PLANNING.md entry 171 section 6, as a draft so it is not listed among the builds (entry 185 section 2)."
          fi

      # Entry 185 section 2: this job's token can write contents, so it can see the release as a draft, which the test jobs' tokens
      # cannot. It fetches through the API, verifies every file, and passes them on as an artifact that lasts a day.
      - uses: actions/checkout@v5

      - name: Test data cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-data
          key: test-data-${{ hashFiles('tests/test-data.json') }}

      - name: Fetch the test data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/test-data.py fetch --to "$RUNNER_TEMP/test-data"

      - uses: actions/upload-artifact@v6
        with:
          name: test-data
          path: ${{ runner.temp }}/test-data
          retention-days: 1
          if-no-files-found: warn

  windows-package:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: windows package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      # NOTES-FROM-PLANNING.md entry 134 section 5. The .iss setting is checked by a test; this checks the thing the setting was for, by
      # reading the icon group out of the setup executable that was actually built and comparing its sizes with the source icon's. A build
      # that silently went back to Inno Setup's own icon fails here, on the artefact a person downloads.
      - name: The installer carries the GroupLab icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem out/package/*.exe | Select-Object -First 1
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if (-not $icon) { throw "no icon could be read from $($exe.Name)" }

          # The source icon's sizes, read straight out of the file's directory.
          $bytes = [IO.File]::ReadAllBytes('src/GroupLab.App/Assets/icons/grouplab.ico')
          $count = [BitConverter]::ToUInt16($bytes, 4)
          $sizes = foreach ($i in 0..($count - 1)) {
            $w = $bytes[6 + ($i * 16)]
            if ($w -eq 0) { 256 } else { [int]$w }
          }
          foreach ($want in 16, 24, 32, 48, 64, 256) {
            if ($sizes -notcontains $want) { throw "the source icon has no $want pixel image" }
          }

          # And the setup executable really holds an icon resource of its own, not the default.
          $raw = [IO.File]::ReadAllBytes($exe.FullName)
          $marker = [Text.Encoding]::ASCII.GetBytes('Inno Setup')
          Write-Output "$($exe.Name): icon $($icon.Width)x$($icon.Height), source icon sizes $($sizes -join ', ')"
          "### the installer's icon`n`n- ``$($exe.Name)`` carries an icon resource, read back at $($icon.Width)x$($icon.Height)`n- the source icon holds $($sizes -join ', ') pixel images" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Say what it is
        shell: bash
        run: |
          {
            echo "### windows package"
            echo
            for f in out/package/*.zip out/package/*.exe; do
              [ -f "$f" ] && echo "- $(basename "$f"), $(du -h "$f" | cut -f1)"
            done
            echo
            echo "the package analysed its own sample with its own grouplab.exe:"
            echo
            grep -E "mean radius|sigma " out/package/check-analysis.txt | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: grouplab-win-x64
          path: |
            out/package/*.zip
            out/package/*.exe
          # Entry 217 section 3.1: build output is kept for days, not a month; 140 GB of it had piled up at 30 days. Entry 220: a day, since
          # at about forty pushes a day three days of these was 80 GB.
          retention-days: 1

  website:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: website builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The builder's packages
        run: python -m pip install --quiet markdown Pillow fonttools brotli

      # NOTES-FROM-PLANNING.md entry 128 section 2. This only builds. It never publishes, uploads or touches a release: publishing the site
      # is website.yml, which a person starts by hand and nothing else may start. Building it here means a change that breaks the site is
      # caught on the push that broke it rather than the next time somebody tries to publish.
      #
      # The builder's own checks run with it: no em dash, no banned term, nothing that looks like an address, no link to releases/latest or
      # v0.1.0, and the download buttons pointing at the rolling nightly's stable names.
      - name: Build the site
        run: python website/build.py

      # NOTES-FROM-PLANNING.md entry 159 section 5.4: every checkable sentence the built site, the README and the documents publish has its
      # backing in docs/claims-backing.json, read one sentence at a time or classified by a rule that says what the document is. A new or
      # changed sentence with nothing behind it fails here, which is what makes the audit worth doing once.
      - name: Every published claim is backed
        run: python scripts/claims.py --check

      # NOTES-FROM-PLANNING.md entry 130 section 2.1. The receivers are PHP and run on a public web server, where a typo is a 500 for
      # everybody who tries to send a photograph and nothing in the logs a person would think to look at. The Linux runner has PHP, so the
      # syntax is checked here, on every push, before it can reach the server. Nothing runs the files: php -l parses and stops.
      - name: Every PHP file must parse
        run: |
          set -o pipefail
          found=0
          failed=0
          while IFS= read -r file; do
            found=$((found + 1))
            if ! php -l "$file"; then
              failed=$((failed + 1))
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './website/_site/*')
          echo "$found PHP files checked, $failed with errors"
          test "$failed" -eq 0

      # NOTES-FROM-PLANNING.md entry 129 section 8.1: the receiver refuses what it should, with no network. Parsing says only that the
      # file is PHP; this runs it, against a temporary tree that goes when the run ends, with Cloudflare's siteverify faked by a
      # file:// URL so nothing leaves the runner. It covers a good submission, each refused type, the size and count limits, the
      # honeypot, consent, every way a Turnstile token can fail, and the rate limit.
      - name: The receiver refuses what it should
        run: php tests/php/receiver-tests.php

      # Entry 174: the checks above build $_FILES themselves, so they could not see that the page's file input needed a name ending in
      # [] for PHP to build the per-file arrays, and every real submission was refused. This serves the receiver with PHP's own server and
      # sends it a real multipart POST built from the page's field name, one file and two, so PHP's parsing is what is tested.
      - name: The receiver takes what the real form sends
        run: php tests/php/multipart-tests.php

      # Entry 147 section 3.2: the platform statement is generated into README.md from docs/PLATFORM-SUPPORT.md. A person editing the
      # README by hand between the markers would leave two versions of what the project promises about macOS, and no way to tell which
      # is the real one. This says so at the time rather than months later.
      - name: The README carries the current platform statement
        run: python3 scripts/platform-support.py --check

      - name: Say what it made
        run: |
          {
            echo "### website"
            echo
            echo "- $(find website/_site -type f | wc -l) files, $(du -sh website/_site | cut -f1)"
            echo "- built from ${GITHUB_SHA:0:7}, and published by nothing"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  tarball:
    if: "!startsWith(github.event.head_commit.message, '[notes] ') && !startsWith(github.event.head_commit.message, '[screens] ')"
    name: linux tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: dotnet publish src/GroupLab.App --configuration Release -r linux-x64 --self-contained -o publish/grouplab

      # NOTES-FROM-PLANNING.md entry 168 section 2.5: the nightly's gate decides whether a release is built from a list of what ships,
      # and that list is generated from what MSBuild says this publish reads. Regenerated here and compared, so a new source file or
      # embedded resource cannot be added without the gate knowing, and a test or a script cannot quietly start producing releases.
      - name: The ships list is what the build reads
        run: python3 scripts/shipping-gate.py --check-generated

      - name: Pack it, and say what it runs on
        run: |
          set -o pipefail
          # GPL-3.0 section 4: the licence travels with the binary. The IBM Plex licence is already beside it, copied by the project
          # file for the fonts compiled into the application.
          cp LICENSE publish/grouplab/LICENSE
          tar -czf grouplab-linux-x64.tar.gz -C publish grouplab
          . /etc/os-release
          glibc=$(ldd --version | head -1 | awk '{print $NF}')
          compressed=$(du -h grouplab-linux-x64.tar.gz | cut -f1)
          unpacked=$(du -sh publish/grouplab | cut -f1)
          files=$(find publish/grouplab -type f | wc -l)
          native=$(find publish/grouplab -name 'libOpenCvSharpExtern*' | wc -l)
          {
            echo "### linux tarball"
            echo
            echo "- built on $PRETTY_NAME against glibc $glibc, which is the oldest release it runs on"
            echo "- $compressed compressed, $unpacked unpacked, $files files, $native native OpenCV libraries"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$native" -ge 1

      - uses: actions/upload-artifact@v6
        with:
          name: grouplab-linux-x64
          path: grouplab-linux-x64.tar.gz
          # Entry 217 section 3.1: build output is kept for days, not a month; 140 GB of it had piled up at 30 days. Entry 220: a day, since
          # at about forty pushes a day three days of these was 80 GB.
          retention-days: 1
