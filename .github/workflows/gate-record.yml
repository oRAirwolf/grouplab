# The Phase 0 gate record reproduced on every platform, NOTES-FROM-PLANNING.md entry 32 section 3 and entry 35 section 6 item 2. Passing the
# tests within tolerance is not the claim; reproducing the record is. Each job reruns the eight Phase 0 spike commands, which rewrite
# scans/phase0/measurements in the working tree, and compares every file byte for byte with the committed record. The one field allowed to
# differ is detectMs in threshold.json, a detection time, which differs between any two runs (docs/PHASE0-RESULTS.md section 8). Where a file
# differs, the step says how: how many values, the largest difference under each field name, and anything that is not a number. Each console
# table is hashed into the run summary so the three platforms can be set side by side, with the threshold table's time column removed first.
name: phase 0 gate record

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  record:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/GroupLab.Cli --configuration Release

      - name: Rerun the Phase 0 spikes
        run: |
          mkdir -p "$RUNNER_TEMP/console"
          for m in sheets photos markers refinement threshold scale field detectors; do
            echo "::group::grouplab spike $m"
            start=$SECONDS
            dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll spike "$m" | tee "$RUNNER_TEMP/console/$m.txt"
            echo "$m took $((SECONDS - start)) s"
            echo "::endgroup::"
          done

      - name: Compare with the committed record
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - sheets photos markers refinement threshold scale field detectors <<'PY'
          import hashlib, json, os, subprocess, sys

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          summary.write(f"### {os.environ['MATRIX_OS']}\n\n| Spike | Record against the commit | Console table, sha256 |\n|---|---|---|\n")
          failed = False
          for m in sys.argv[1:]:
              path = f"scans/phase0/measurements/{m}.json"
              committed = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, check=True).stdout
              generated = open(path, "rb").read()
              skip = {"detectMs"} if m == "threshold" else set()

              def text(data):
                  return b"\n".join(line for line in data.split(b"\n") if not any(f'"{k}"'.encode() in line for k in skip))

              console = open(os.path.join(os.environ["RUNNER_TEMP"], "console", f"{m}.txt"), "rb").read().replace(b"\r", b"")
              if m == "threshold":
                  console = b"\n".join(b"|".join(c if i != 5 else b"" for i, c in enumerate(line.split(b"|"))) if line.count(b"|") > 6 else line for line in console.split(b"\n"))
              table = hashlib.sha256(console).hexdigest()[:16]
              note = ", detectMs left out" if skip else ""
              if text(committed) == text(generated):
                  summary.write(f"| `{m}` | identical{note} | `{table}` |\n")
                  continue

              failed = True
              differences = []

              def walk(a, b, where):
                  if isinstance(a, dict) and isinstance(b, dict):
                      for key in sorted(set(a) | set(b)):
                          if key in skip:
                              continue
                          if key not in a or key not in b:
                              differences.append((f"{where}/{key}", a.get(key, "<absent>"), b.get(key, "<absent>")))
                          else:
                              walk(a[key], b[key], f"{where}/{key}")
                  elif isinstance(a, list) and isinstance(b, list):
                      if len(a) != len(b):
                          differences.append((where, f"{len(a)} items", f"{len(b)} items"))
                      for i, (x, y) in enumerate(zip(a, b)):
                          walk(x, y, f"{where}/{i}")
                  elif a != b or type(a) is not type(b):
                      differences.append((where, a, b))

              walk(json.loads(committed), json.loads(generated), "")
              number = lambda v: isinstance(v, (int, float)) and not isinstance(v, bool)
              numeric = [d for d in differences if number(d[1]) and number(d[2])]
              other = [d for d in differences if not (number(d[1]) and number(d[2]))]
              by_field = {}
              for where, a, b in numeric:
                  field = where.rsplit("/", 1)[-1]
                  if field not in by_field or abs(a - b) > abs(by_field[field][1] - by_field[field][2]):
                      by_field[field] = (where, a, b)
              largest = sorted(by_field.items(), key=lambda kv: -abs(kv[1][1] - kv[1][2]))
              head = ", ".join(f"{field} {abs(a - b):.4g}" for field, (_, a, b) in largest[:4])
              summary.write(f"| `{m}` | **differs**: {len(differences)} values, {len(numeric)} numeric (largest by field: {head}), {len(other)} not numeric{note} | `{table}` |\n")
              print(f"::group::{m}.json: {len(differences)} values differ, {len(numeric)} numeric, {len(other)} not numeric")
              print("largest difference under each field name:")
              for field, (where, a, b) in largest:
                  print(f"  {field:<24} {abs(a - b):.6g}   at {where}: {a} committed, {b} here")
              for where, a, b in other[:40]:
                  print(f"  not numeric at {where}: {a!r} committed, {b!r} here")
              print("::endgroup::")

          sys.exit(1 if failed else 0)
          PY
        env:
          MATRIX_OS: ${{ matrix.os }}

      # Entry 47 section 3: how many Phase 0 images name their own definition on this platform. The QR detectors are native code, a
      # different build on each platform, so the count is measured here rather than assumed from Windows. It is reported, not compared,
      # and fails the step only when an image names a definition or tile it was not printed from.
      - name: Identify the Phase 0 sheets from their codes
        if: always()
        run: |
          set -o pipefail
          dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll identify sweep | tee "$RUNNER_TEMP/console/identify.txt"
          { echo "### ${{ matrix.os }}: Phase 0 sheets named from their codes"; echo; cat "$RUNNER_TEMP/console/identify.txt"; } >> "$GITHUB_STEP_SUMMARY"

      # The records and console tables as this platform wrote them, so a difference can be checked rather than taken on trust.
      - name: Keep the records
        if: always()
        run: cp -r scans/phase0/measurements "$RUNNER_TEMP/records"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-record-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/records
            ${{ runner.temp }}/console
          retention-days: 30
