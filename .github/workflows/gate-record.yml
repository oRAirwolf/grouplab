# The Phase 0 gate record reproduced on every platform, NOTES-FROM-PLANNING.md entry 32 section 3, entry 35 section 6 item 2 and entry 49
# section 1. The record reproduces on a platform when every gate verdict is identical and every printed table is identical: the tables are
# what a person reads and acts on, and a verdict can only change through a figure in them. Each job reruns the eight Phase 0 spike commands
# and compares their console tables line for line with the Windows tables committed in scans/phase0/measurements/tables. The threshold
# table's detection time column is the one thing left out, because it differs between any two runs. That comparison fails the job.
#
# The raw records are still compared byte for byte with the committed ones, and where they differ the step reports how many values differ,
# the largest difference under each field name, and anything that is not a number. That is reported, never gated: a raw difference below
# printed precision is a question worth seeing, not a failure. Nothing here sets a tolerance or names a magnitude.
name: phase 0 gate record

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  record:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/GroupLab.Cli --configuration Release

      - name: Rerun the Phase 0 spikes
        run: |
          mkdir -p "$RUNNER_TEMP/console"
          for m in sheets photos markers refinement threshold scale field detectors; do
            echo "::group::grouplab spike $m"
            start=$SECONDS
            dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll spike "$m" | tee "$RUNNER_TEMP/console/$m.txt"
            echo "$m took $((SECONDS - start)) s"
            echo "::endgroup::"
          done

      - name: Compare the printed tables, and report the raw records
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - sheets photos markers refinement threshold scale field detectors <<'PY'
          import difflib, json, os, subprocess, sys

          def table(text, m):
              lines = text.replace("\r", "").split("\n")
              if m == "threshold":
                  lines = ["|".join(c if i != 5 else "" for i, c in enumerate(line.split("|"))) if line.count("|") > 6 else line for line in lines]
              return lines

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          summary.write(f"### {os.environ['MATRIX_OS']}\n\n| Spike | Printed table, gated | Raw record, reported |\n|---|---|---|\n")
          failed = False
          for m in sys.argv[1:]:
              reference = table(open(f"scans/phase0/measurements/tables/{m}.txt", encoding="utf-8").read(), m)
              printed = table(open(os.path.join(os.environ["RUNNER_TEMP"], "console", f"{m}.txt"), encoding="utf-8").read(), m)
              if printed == reference:
                  verdict = "identical" + (", time column left out" if m == "threshold" else "")
              else:
                  failed = True
                  changed = [line for line in difflib.unified_diff(reference, printed, "windows", "here", n=0, lineterm="") if line[:1] in "+-" and not line.startswith(("+++", "---"))]
                  verdict = f"**differs**, {sum(1 for line in changed if line.startswith('-'))} lines"
                  print(f"::group::{m}: printed table against the committed Windows table")
                  print("\n".join(changed))
                  print("::endgroup::")

              path = f"scans/phase0/measurements/{m}.json"
              committed = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, check=True).stdout
              generated = open(path, "rb").read()
              skip = {"detectMs"} if m == "threshold" else set()

              def text(data):
                  return b"\n".join(line for line in data.split(b"\n") if not any(f'"{k}"'.encode() in line for k in skip))

              if text(committed) == text(generated):
                  raw = "identical"
              else:
                  differences = []

                  def walk(a, b, where):
                      if isinstance(a, dict) and isinstance(b, dict):
                          for key in sorted(set(a) | set(b)):
                              if key in skip:
                                  continue
                              if key not in a or key not in b:
                                  differences.append((f"{where}/{key}", a.get(key, "<absent>"), b.get(key, "<absent>")))
                              else:
                                  walk(a[key], b[key], f"{where}/{key}")
                      elif isinstance(a, list) and isinstance(b, list):
                          if len(a) != len(b):
                              differences.append((where, f"{len(a)} items", f"{len(b)} items"))
                          for i, (x, y) in enumerate(zip(a, b)):
                              walk(x, y, f"{where}/{i}")
                      elif a != b or type(a) is not type(b):
                          differences.append((where, a, b))

                  walk(json.loads(committed), json.loads(generated), "")
                  number = lambda v: isinstance(v, (int, float)) and not isinstance(v, bool)
                  numeric = [d for d in differences if number(d[1]) and number(d[2])]
                  other = [d for d in differences if not (number(d[1]) and number(d[2]))]
                  by_field = {}
                  for where, a, b in numeric:
                      field = where.rsplit("/", 1)[-1]
                      if field not in by_field or abs(a - b) > abs(by_field[field][1] - by_field[field][2]):
                          by_field[field] = (where, a, b)
                  largest = sorted(by_field.items(), key=lambda kv: -abs(kv[1][1] - kv[1][2]))
                  head = ", ".join(f"{field} {abs(a - b):.4g}" for field, (_, a, b) in largest[:4])
                  raw = f"{len(differences)} values differ, {len(numeric)} numeric (largest by field: {head}), {len(other)} not numeric"
                  print(f"::group::{m}.json: {raw}")
                  for field, (where, a, b) in largest:
                      print(f"  {field:<24} {abs(a - b):.6g}   at {where}: {a} committed, {b} here")
                  for where, a, b in other[:40]:
                      print(f"  not numeric at {where}: {a!r} committed, {b!r} here")
                  print("::endgroup::")

              summary.write(f"| `{m}` | {verdict} | {raw} |\n")

          sys.exit(1 if failed else 0)
          PY
        env:
          MATRIX_OS: ${{ matrix.os }}

      # Entry 47 section 3: how many Phase 0 images name their own definition on this platform. The QR detectors are native code, a
      # different build on each platform, so the count is measured here rather than assumed from Windows. It is reported, not compared,
      # and fails the step only when an image names a definition or tile it was not printed from.
      - name: Identify the Phase 0 sheets from their codes
        if: always()
        run: |
          set -o pipefail
          dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll identify sweep | tee "$RUNNER_TEMP/console/identify.txt"
          { echo "### ${{ matrix.os }}: Phase 0 sheets named from their codes"; echo; cat "$RUNNER_TEMP/console/identify.txt"; } >> "$GITHUB_STEP_SUMMARY"

      # The records and console tables as this platform wrote them, so a difference can be checked rather than taken on trust.
      - name: Keep the records
        if: always()
        run: cp -r scans/phase0/measurements "$RUNNER_TEMP/records"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-record-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/records
            ${{ runner.temp }}/console
          retention-days: 30

  # NOTES-FROM-PLANNING.md entry 49 section 2, ordered by entry 52 section 5 item 4: whether corner refinement is the only place the
  # platforms diverge, or the first of two. Windows records what its detector returned for every image the markers and refinement
  # measurements ask it for, and macOS reruns those two measurements from those corners, in Windows' order, with everything below
  # detection still its own. The journal's image hashes separate a difference in the image from a difference in the corners. Reported,
  # never gated: the record job above is what fails.
  corners:
    name: windows corners
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/GroupLab.Cli --configuration Release

      - name: Record what the detector returned
        run: dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll spike corners --export "$RUNNER_TEMP/corners.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-corners
          path: ${{ runner.temp }}/corners.json
          retention-days: 30

  replay:
    name: macos-latest, from windows corners
    needs: corners
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/GroupLab.Cli --configuration Release

      - uses: actions/download-artifact@v6
        with:
          name: windows-corners
          path: ${{ runner.temp }}

      - name: Rerun the two measurements from Windows' corners
        run: |
          set -o pipefail
          dotnet src/GroupLab.Cli/bin/Release/net10.0/grouplab.dll spike corners --replay "$RUNNER_TEMP/corners.json" | tee "$RUNNER_TEMP/replay.txt"
          { echo "### macos-latest, the markers and refinement measurements rerun from Windows' corners"; echo; cat "$RUNNER_TEMP/replay.txt"; } >> "$GITHUB_STEP_SUMMARY"
