# A numbered release anybody can download, NOTES-FROM-PLANNING.md entry 116 section 3. A GitHub release is a plain download link: no account,
# no sign-in, which is the answer to "no GitHub". The workflow runs on a tag, and by hand from the Actions tab, where it makes a draft release
# so a test build can be looked at before anyone sees it.
#
# Entry 119 section 8: a numbered release is a deliberate act. Nothing here pushes a v* tag by itself except the nightly workflow, which
# tags its own pre-releases; a beta or a release happens only when Alan asks for one by name. The train that follows every green push is
# nightly.yml, and its releases are pre-releases, so this one stays what releases/latest points at.
#
# The packages themselves are package.yml, which nightly.yml calls too, so the two cannot drift apart.
#
# Every asset is attached twice: once under a name carrying the version and the commit, so a bug report names a build, and once under a stable
# name, so https://github.com/oRAirwolf/grouplab/releases/latest/download/<stable name> keeps working without anyone editing the README after a
# release. ReleaseAssetTests holds the README's links to the names below.
#
# The macOS build stays out until somebody can run it: the gate record passes there, and nobody has opened the application on a Mac.
#
# Entry 293: a run by hand with store_draft builds only the Microsoft Store package, checks its identity against the repository's
# variables, runs the Windows App Certification Kit, attaches it to a draft release named store-draft-<version>, which is never a v* tag,
# and proves the Store login with one read. Nothing is submitted to the Store, and no other package, release or commit is made.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to name the assets by, such as 0.1.0'
        required: false
        default: ''
      store_draft:
        description: 'Only the Microsoft Store package, as a draft release, and a Store login check that submits nothing (entry 293)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  work-out-the-version:
    name: work out the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: name
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$version" ]; then version=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: package
    needs: work-out-the-version
    if: ${{ !inputs.store_draft }}
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.work-out-the-version.outputs.version }}
      train: release

  # NOTES-FROM-PLANNING.md entry 224 section 3: the Microsoft Store's MSIX, with the identity Partner Center gave when the name GroupLab was
  # reserved, from the repository's variables. A run by hand makes a draft carrying it, which is how the first submission is made by hand;
  # every tagged release after that is published to the Store by the job below. Without the variables it builds nothing and says so.
  msix:
    name: the Microsoft Store package
    needs: work-out-the-version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: The Store's identity
        id: identity
        shell: bash
        run: |
          if [ -n "$STORE_IDENTITY_NAME" ] && [ -n "$STORE_PUBLISHER" ] && [ -n "$STORE_PUBLISHER_DISPLAY_NAME" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "### No Store identity in the repository's variables yet, so no Store package (request 38)." >> "$GITHUB_STEP_SUMMARY"
            # A run asked for the Store package alone has nothing else to do, so there it is a failure.
            if [ "${{ inputs.store_draft }}" = "true" ]; then echo "::error::STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME must all be set"; exit 1; fi
          fi

      - uses: actions/checkout@v5
        if: steps.identity.outputs.present == 'yes'

      - uses: actions/setup-dotnet@v5
        if: steps.identity.outputs.present == 'yes'
        with:
          dotnet-version: '10.0.x'

      - name: Build the MSIX
        if: steps.identity.outputs.present == 'yes'
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Version '${{ needs.work-out-the-version.outputs.version }}' -Train release -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      # Entry 293 section 1: the manifest's identity against the variables, every time, and the certification kit on a store_draft run.
      - name: Check the MSIX
        if: steps.identity.outputs.present == 'yes'
        shell: pwsh
        run: ./scripts/check-msix.ps1 -Msix out/package/grouplab-win-x64.msix -Report out/wack/wack-report.xml ${{ inputs.store_draft && '-Certify' || '' }}

      - uses: actions/upload-artifact@v6
        if: steps.identity.outputs.present == 'yes'
        with:
          name: windows-msix
          path: out/package/grouplab-win-x64.msix
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ always() && inputs.store_draft && steps.identity.outputs.present == 'yes' }}
        with:
          name: wack-report
          path: out/wack/
          if-no-files-found: ignore
          retention-days: 30

  # Entry 293 section 1: the package the first, hand-made submission uploads (request 38, Part B), on a draft release. A draft makes no tag
  # until it is published, and its name is store-draft-<version>, never v*, so nothing here can start a release or look like one.
  store-draft:
    name: the Store package as a draft release
    needs: [work-out-the-version, msix]
    if: ${{ inputs.store_draft && needs.msix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: store-draft-${{ needs.work-out-the-version.outputs.version }}
      VERSION: ${{ needs.work-out-the-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: windows-msix
          path: msix

      - name: Make the draft
        run: |
          set -euo pipefail
          file=msix/grouplab-win-x64.msix
          size=$(stat -c %s "$file")
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          # A draft of the same name is replaced, so there is one per version; a published release of that name is never touched.
          was=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$was" = "false" ]; then echo "::error::$TAG is a published release, which this never replaces"; exit 1; fi
          if [ "$was" = "true" ]; then gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes; fi
          {
            echo "The Microsoft Store package of GroupLab $VERSION, from commit $GITHUB_SHA, for the first submission in Partner Center (request 38, Part B)."
            echo
            echo "It is unsigned, because the Store signs what it distributes, so Windows will not install this file directly. For GroupLab itself, use the installer or the zip from the newest nightly."
            echo
            echo "$size bytes, SHA-256 $sha."
          } > notes.md
          gh release create "$TAG" "$file" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "GroupLab $VERSION for the Microsoft Store, draft" --notes-file notes.md
          # A draft makes no tag; if GitHub ever did, this says so rather than leaving a tag behind unnoticed.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq length)
          url=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "### The Store package is on a draft release: $url"
            echo "grouplab-win-x64.msix, $size bytes, SHA-256 $sha. Tags named $TAG in the repository: $tags."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$tags" != "0" ]; then echo "::error::the draft made a tag named $TAG"; exit 1; fi

  release:
    name: release
    needs: [work-out-the-version, package, msix]
    # The Store package is never a condition: a release without it is still a release.
    if: ${{ !cancelled() && !inputs.store_draft && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: assets

      - name: Gather the assets
        run: |
          mkdir -p release
          find assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.msix' \) -exec cp {} release/ \;
          ls -la release

      # A run by hand makes a draft, so a test build is looked at before anyone sees it; a tag publishes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-draft', needs.work-out-the-version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('GroupLab {0}, draft', needs.work-out-the-version.outputs.version) }}
          draft: ${{ github.ref_type != 'tag' }}
          files: release/*
          body: |
            An unsigned test build of GroupLab, from commit ${{ github.sha }}.

            **Windows:** download `grouplab-setup-win-x64.exe` for an installer, or `grouplab-win-x64.zip` to unzip and run. Windows will say
            "Windows protected your PC", because the build is not signed: click More info, then Run anyway. The README.txt inside says where
            GroupLab keeps your sessions and how to remove it.

            **Linux:** `grouplab-linux-x64.tar.gz`, self-contained, built on the runner's Ubuntu, which is the oldest release it runs on.

            **macOS** is built and tested but nobody has run it, so it is not offered here.

            What is done and what is not is in the repository's README, which is the authority on states.

      # NOTES-FROM-PLANNING.md entry 184: a published release, never a draft, announces itself in #builds and in #announcements, with its
      # notes from the same generator as a nightly's. Nothing here can fail the release, and a missing secret skips its channel.
      - name: Announce the release in Discord
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK: ${{ secrets.DISCORD_BUILDS_WEBHOOK }}
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.work-out-the-version.outputs.version }}
        run: |
          for secret in "$DISCORD_BUILDS_WEBHOOK" "$DISCORD_ANNOUNCE_WEBHOOK"; do
            if [ -n "$secret" ]; then echo "::add-mask::$secret"; fi
          done
          git fetch --quiet --tags origin
          python3 scripts/release-notes.py "$VERSION" "$GITHUB_SHA" > announce.md
          { echo "### Discord"; echo; python3 scripts/discord-announce.py "$VERSION" announce.md --stable; } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f announce.md
          if [ -n "$(git status --porcelain -- .github/announced-builds.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch --quiet origin main
            git stash --quiet
            git checkout --quiet -B main origin/main
            git stash pop --quiet
            git add .github/announced-builds.txt
            git commit -m "[notes] Announced $VERSION" -m "Recorded by the release workflow so a rerun does not post it twice, NOTES-FROM-PLANNING.md entry 184."
            git push origin main || { git pull --rebase --quiet origin main && git push origin main; }
          fi

      # NOTES-FROM-PLANNING.md entry 244: the README's generated sections, rewritten and committed as a [notes] commit when they changed.
      - name: Bring the README up to date
        env:
          VERSION: ${{ needs.work-out-the-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          python3 scripts/readme.py --write
          if [ -n "$(git status --porcelain -- README.md)" ]; then
            git add README.md
            git commit -m "[notes] README for $VERSION" -m "Its generated sections, rewritten by the release workflow, NOTES-FROM-PLANNING.md entry 244."
            git push origin main || { git pull --rebase --quiet origin main && git push origin main; }
          fi

  # NOTES-FROM-PLANNING.md entry 224 section 3.2: a tagged stable release goes to the Store's public listing by itself. The Store's own
  # tooling, authenticated as the Entra application Partner Center trusts as a Manager; the four values are repository secrets Alan sets.
  # It needs the app already live in the Store, which the first, hand-made submission does. Nightlies never come here.
  # Entry 293 section 2: every run here first proves the login with one read, so an expired secret fails in plain words; a store_draft run
  # stops there and submits nothing.
  store:
    name: publish to the Microsoft Store
    needs: [work-out-the-version, msix, release]
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.store_draft) && needs.msix.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER: ${{ secrets.SELLER_ID }}
      CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      PRODUCT: ${{ vars.STORE_PRODUCT_ID }}
    steps:
      - name: The Store's credentials
        id: store
        shell: bash
        run: |
          if [ -n "$TENANT" ] && [ -n "$SELLER" ] && [ -n "$CLIENT" ] && [ -n "$SECRET" ] && [ -n "$PRODUCT" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "### The Store's credentials are not all set, so this release was not sent to the Store (request 38)." >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ inputs.store_draft }}" = "true" ]; then echo "::error::the Store's four secrets and STORE_PRODUCT_ID must all be set to check the login"; exit 1; fi
          fi

      - uses: actions/checkout@v5
        if: steps.store.outputs.present == 'yes'

      # One read of the product, which changes nothing; if Entra refuses, it says the Store secret may have expired.
      - name: Check the Store login
        if: steps.store.outputs.present == 'yes'
        shell: pwsh
        run: ./scripts/store-login-check.ps1

      - uses: actions/download-artifact@v6
        if: steps.store.outputs.present == 'yes' && github.ref_type == 'tag'
        with:
          name: windows-msix
          path: msix

      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.store.outputs.present == 'yes' && github.ref_type == 'tag'

      - name: Publish the package
        if: steps.store.outputs.present == 'yes' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw 'The Store tooling could not sign in: the Store secret may have expired, or the seller ID may be wrong (request 38).' }
          msstore publish (Resolve-Path msix/grouplab-win-x64.msix) -id $env:PRODUCT
          "### Sent GroupLab ${{ needs.work-out-the-version.outputs.version }} to the Microsoft Store; it appears once certification passes." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
