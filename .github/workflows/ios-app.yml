name: ios app

# NOTES-FROM-PLANNING.md entry 290 section 2 items 3 and 4: the iPhone and iPad application (ios/GroupLab.iOS) built on GitHub's macos-26
# machine with Xcode 26, and proved on the iOS Simulator: it starts, every place along the bottom opens and is photographed, the imaging works
# on a rendered GroupLab sheet, and the committed sample scan gives the same shots and figures as the desktop, which runs the same checks from
# the same code in this job (ios/SelfTestReference). The device build is made too, unsigned, to prove it compiles and links; nothing is
# signed or published here. OpenCV for iOS comes from the newest successful run of the workflow "ios" (ios/opencv/build-extern.sh); where
# there is none yet the head is built without it and the imaging checks are skipped with a notice.

on:
  push:
    branches: ['ios/**']
  workflow_dispatch:

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  simulator:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      # The repository has no global.json; the desktop's workflows take the newest .NET 10, and so does this.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The newest iOS workload wants the Xcode after 26 (27.0.10722 refused Xcode 26.6), so the workload is held to the newest one made
      # for Xcode 26. The manifest's band is 10.0.100 whatever the SDK's band is.
      - name: The .NET iOS workload
        run: |
          ls -d /Applications/Xcode_26*.app | tr '\n' ' '; echo
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          xcrun nm -gUm ios/native/OpenCvSharpExtern.xcframework/ios-arm64-simulator/libOpenCvSharpExtern.a 2>/dev/null | grep -E " _vector_Point2f_(delete|new1)$" || echo "vector_Point2f_delete is not defined in the simulator archive"
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        run: |
          dotnet build ios/GroupLab.iOS --configuration Release -r iossimulator-arm64 \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -bl:build-simulator.binlog -v:minimal -clp:ErrorsOnly > build-simulator.log 2>&1 || { grep -E "error" build-simulator.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*iossimulator-arm64*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          du -sh "$app"
          # The sheets in the bundle, each in its own place: a grep for either passed on Android with them in the wrong one.
          for item in targets/GL-CF25-LTR.gltd.json targets/GL-CF25-LTR-D.gltd.json; do
            test -f "$app/$item" || { echo "::error::The application does not carry $item"; exit 1; }
          done
          ls "$app/targets/frozen" | head -3
          # Entry 292 section 2.3: the share extension inside the application, and a share-services extension. The simulator self-test
          # proves the app group, which the simulator grants from the entitlements the build embeds.
          appex="$app/PlugIns/GroupLab.Share.appex"
          test -d "$appex" || { echo "::error::The application carries no share extension"; ls "$app" | head -40; exit 1; }
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist")" = "com.apple.share-services" || { echo "::error::The extension is not a share extension"; exit 1; }
          plutil -extract CFBundleIdentifier raw "$appex/Info.plist"
          du -sh "$appex"
          test -n "$(ls "$app/targets/frozen"/*.gltd.json 2>/dev/null)" || { echo "::error::The application carries no frozen sheets"; exit 1; }
          if [ "${{ steps.opencv.outputs.linked }}" = "true" ]; then
            nm -gU "$app/GroupLab.iOS" 2>/dev/null | grep -c " T _core_Mat_new1$" || { echo "::error::OpenCV's entry points are not in the executable"; exit 1; }
            nm -gU "$app/GroupLab.iOS" 2>/dev/null | grep -E " _vector_Point2f_delete$" || echo "vector_Point2f_delete is not in the executable"
          fi

          # Entry 315's amendment, section 5: the public application carries none of GroupLab Dev's developer tools, which are compiled
          # out of it; GroupLab Dev's own job checks that its library has them.
          dll=$(find "$app" -name 'GroupLab.Mobile.dll' | head -1)
          if [ -n "$dll" ] && grep -q "GroupLab.Mobile.Dev" "$dll"; then echo "::error::GroupLab carries GroupLab Dev's developer tools"; exit 1; fi
          test -n "$dll" && echo "GroupLab.Mobile.dll carries no developer tools" || echo "::notice::No GroupLab.Mobile.dll in the bundle to look into"

      - name: Boot an iOS 26 simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [(runtime, d) for runtime, ds in devices.items() if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")]
          found.sort(key=lambda p: (p[0], "Pro" in p[1]["name"], p[1]["name"]))
          print(found[-1][1]["udid"] if found else "")')
          test -n "$udid" || { xcrun simctl list runtimes; echo "::error::No iOS 26 iPhone simulator"; exit 1; }
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Entry 290 section 6: an iPad beside it for the wide screens, an iPad mini where the runner has one since that is the device
          # the sittings use. Booted only once the iPhone is done with: a second simulator starting beside it made every screenshot take
          # a minute and a half (runs 36688921677 and 36693793801).
          ipad=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [(runtime, d) for runtime, ds in devices.items() if "iOS-26" in runtime for d in ds if d["name"].startswith("iPad")]
          found.sort(key=lambda p: ("mini" in p[1]["name"], p[0], p[1]["name"]))
          print(found[-1][1]["udid"] if found else "")')
          if [ -n "$ipad" ]; then
            xcrun simctl list devices | grep "$ipad"
            echo "IPAD=$ipad" >> "$GITHUB_ENV"
          else
            echo "::warning::No iOS 26 iPad simulator on this runner"
          fi

      - name: Install and start
        run: |
          mkdir -p shots
          xcrun simctl install "$UDID" "$APP"
          # The first start as a person sees it, with the first run's questions if this build asks them.
          xcrun simctl launch "$UDID" org.grouplab.app
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/00-first-start.png > /dev/null
          xcrun simctl terminate "$UDID" org.grouplab.app || true
          data=$(xcrun simctl get_app_container "$UDID" org.grouplab.app data)
          echo "DATA=$data" >> "$GITHUB_ENV"
          # Entry 292 section 2.3: iOS registered the share extension, so GroupLab is offered in other apps' share sheets.
          xcrun simctl spawn "$UDID" pluginkit -m -A -v -i org.grouplab.app.share 2>&1 | tee pluginkit.txt
          grep -q "org.grouplab.app.share" pluginkit.txt || { echo "::error::iOS did not register the share extension"; exit 1; }
          echo "the share extension is registered"
          # The committed sample scan, whose consent is in samples/PROVENANCE.md, put where the self-test reads it.
          mkdir -p "$data/Documents/selftest"
          cp samples/gl-cf25-ltr-d-25-shots-600-dpi.png "$data/Documents/selftest/sample.png"

      - name: Self-test
        timeout-minutes: 35
        run: |
          folder="$DATA/Documents/selftest"
          rm -f "$folder/status" "$folder/showing" "$folder/taken" "$folder/results.json"
          SIMCTL_CHILD_GROUPLAB_ARGUMENTS=--self-test xcrun simctl launch --console-pty "$UDID" org.grouplab.app --self-test > app-console.log 2>&1 &
          launcher=$!
          # Each screen the self-test names in showing is photographed, and the name written back in taken, before it moves on. The
          # launcher ends when the application does, so an application that stopped is seen at once rather than at the time limit.
          # The limit is 1900 s since a slow runner was still at Compare after 1500 (entry 290 section 6, run 36688921677).
          last=""
          status=""
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 1900 ]; do
            status=$(cat "$folder/status" 2>/dev/null || true)
            showing=$(cat "$folder/showing" 2>/dev/null || true)
            if [ -n "$showing" ] && [ "$showing" != "$last" ]; then
              xcrun simctl io "$UDID" screenshot "shots/$showing.png" > /dev/null
              printf '%s' "$showing" > "$folder/taken"
              echo "$(( $(date +%s) - start )) s: photographed $showing"
              last="$showing"
            fi
            [ "$status" = "done" ] && break
            if ! kill -0 "$launcher" 2>/dev/null; then
              echo "::error::The application ended during the self-test (status: $status)"
              xcrun simctl io "$UDID" screenshot "shots/99-when-it-ended.png" > /dev/null || true
              break
            fi
            sleep 1
          done
          echo "status after $(( $(date +%s) - start )) s: $status"
          grep "SELFTEST" app-console.log | grep -v SHOWING || true
          mkdir -p app-logs && cp -R "$DATA/Documents/logs/." app-logs/ 2>/dev/null || true
          cp "$folder/results.json" ios-results.json 2>/dev/null || { echo "::error::The self-test wrote no results (status: $status)"; grep -v "^\s*$" app-console.log | tail -60; exit 1; }
          xcrun simctl terminate "$UDID" org.grouplab.app || true

      # Entry 290 section 6: the dark theme, which every shot above is not in. Capture with the bar along the bottom, as a person starts it
      # with the phone set to dark; the first run's questions were answered by the self-test.
      - name: The dark theme
        run: |
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" org.grouplab.app
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/97-dark-capture.png > /dev/null
          xcrun simctl terminate "$UDID" org.grouplab.app || true
          xcrun simctl ui "$UDID" appearance light

      # Entry 290 section 6: the wide screens nobody had photographed. The same one build, on the iPhone turned on its side and on the iPad
      # in both orientations: the application's short tour (--screens) opens every place along the bottom and the sample's result, and names
      # each screen as the self-test does. The pictures go in folders of their own beside the self-test's.
      - name: The iPad and landscape
        if: steps.opencv.outputs.linked == 'true'
        timeout-minutes: 20
        run: |
          tour() {
            udid=$1; out=$2; shift 2
            folder="$(xcrun simctl get_app_container "$udid" org.grouplab.app data)/Documents/selftest"
            mkdir -p "$folder" "$out"
            rm -f "$folder/status" "$folder/showing" "$folder/taken" "$folder/results.json"
            SIMCTL_CHILD_GROUPLAB_ARGUMENTS="$*" xcrun simctl launch --console-pty "$udid" org.grouplab.app "$@" > "$out/console.log" 2>&1 &
            launcher=$!
            last=""
            status=""
            start=$(date +%s)
            while [ $(( $(date +%s) - start )) -lt 400 ]; do
              status=$(cat "$folder/status" 2>/dev/null || true)
              showing=$(cat "$folder/showing" 2>/dev/null || true)
              if [ -n "$showing" ] && [ "$showing" != "$last" ]; then
                xcrun simctl io "$udid" screenshot "$out/$showing.png" > /dev/null
                printf '%s' "$showing" > "$folder/taken"
                last="$showing"
              fi
              [ "$status" = "done" ] && break
              kill -0 "$launcher" 2>/dev/null || { echo "::error::The application ended during the tour for $out (status: $status)"; break; }
              sleep 1
            done
            cp "$folder/results.json" "$out/results.json" 2>/dev/null || true
            xcrun simctl terminate "$udid" org.grouplab.app || true
            grep "SELFTEST" "$out/console.log" | grep -v SHOWING || true
            echo "$out after $(( $(date +%s) - start )) s: $(ls "$out" | grep -c '\.png$') screenshots, status $status"
            test -f "$out/results.json" && ls "$out" | grep -q -- '-chosen-picture\.png$'
          }
          failed=0
          tour "$UDID" shots/landscape --screens --landscape || failed=1
          if [ -n "$IPAD" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$IPAD"
            xcrun simctl bootstatus "$IPAD" -b > /dev/null
            xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$IPAD" "$APP"
            mkdir -p shots/ipad
            xcrun simctl launch "$IPAD" org.grouplab.app
            sleep 20
            xcrun simctl io "$IPAD" screenshot shots/ipad/00-first-start.png > /dev/null
            xcrun simctl terminate "$IPAD" org.grouplab.app || true
            data=$(xcrun simctl get_app_container "$IPAD" org.grouplab.app data)
            mkdir -p "$data/Documents/selftest"
            cp samples/gl-cf25-ltr-d-25-shots-600-dpi.png "$data/Documents/selftest/sample.png"
            tour "$IPAD" shots/ipad --screens || failed=1
            # An iPad showing apps in windows refuses an application's own request to turn, so the simulator is turned from its Device
            # menu first, with only the iPad running; the tour turns the screen itself only where it is still upright.
            open -a Simulator --args -CurrentDeviceUDID "$IPAD"
            sleep 15
            osascript -e 'tell application "Simulator" to activate' -e 'delay 2' \
              -e 'tell application "System Events" to tell process "Simulator" to click menu item "Rotate Left" of menu "Device" of menu bar 1' 2>&1 \
              || osascript -e 'tell application "Simulator" to activate' -e 'delay 2' -e 'tell application "System Events" to key code 123 using command down' 2>&1 \
              || echo "the simulator could not be turned from its menu"
            sleep 5
            tour "$IPAD" shots/ipad-landscape --screens --landscape || failed=1
            xcrun simctl shutdown "$IPAD" || true
          fi
          [ "$failed" = 0 ] || { echo "::error::A tour did not reach the sample's result"; exit 1; }

      - name: The desktop's numbers
        if: steps.opencv.outputs.linked == 'true'
        run: |
          budget=$(python3 -c 'import json; print(json.load(open("ios-results.json"))["budgetMb"])')
          dotnet build ios/SelfTestReference --configuration Release -v:minimal -clp:ErrorsOnly > build-reference.log 2>&1 || { grep -E "error" build-reference.log | sort -u | head -40; exit 1; }
          dotnet ios/SelfTestReference/bin/Release/net10.0/GroupLab.iOS.SelfTestReference.dll "$RUNNER_TEMP/reference" . "$budget" desktop-results.json | tail -20

      - name: Compare
        run: python3 ios/selftest.py ios-results.json desktop-results.json --screens shots

      - name: Crash reports
        if: failure()
        run: |
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i grouplab | head || true
          mkdir -p crashes && cp ~/Library/Logs/DiagnosticReports/*GroupLab* crashes/ 2>/dev/null || true
          tail -80 app-console.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            shots
            ios-results.json
            desktop-results.json
            app-console.log
            app-logs
            pluginkit.txt
            crashes
            build-*.log
            build-*.binlog
          retention-days: 14
          if-no-files-found: warn

  # The device build in its own job, beside the simulator's, since each takes a quarter of an hour.
  device:
    name: iOS device, unsigned
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      # The repository has no global.json; the desktop's workflows take the newest .NET 10, and so does this.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The newest iOS workload wants the Xcode after 26 (27.0.10722 refused Xcode 26.6), so the workload is held to the newest one made
      # for Xcode 26. The manifest's band is 10.0.100 whatever the SDK's band is.
      - name: The .NET iOS workload
        run: |
          ls -d /Applications/Xcode_26*.app | tr '\n' ' '; echo
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      # Unsigned until the signing secrets exist (request 55): this proves the device build compiles and links, and uploads nothing.
      - name: Build for a device, unsigned
        run: |
          dotnet build ios/GroupLab.iOS --configuration Release -r ios-arm64 \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -p:EnableCodeSigning=false -bl:build-device.binlog \
            -v:minimal -clp:ErrorsOnly > build-device.log 2>&1 || { grep -E "error" build-device.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*ios-arm64*' -not -path '*simulator*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          du -sh "$app"
          lipo -info "$app/GroupLab.iOS"
          test -d "$app/PlugIns/GroupLab.Share.appex" || { echo "::error::The device build carries no share extension"; exit 1; }
          lipo -info "$app/PlugIns/GroupLab.Share.appex/GroupLab.Share"
          if [ "${{ steps.opencv.outputs.linked }}" = "true" ]; then
            nm -gU "$app/GroupLab.iOS" 2>/dev/null | grep -c " T _core_Mat_new1$" || { echo "::error::OpenCV's entry points are not in the device executable"; exit 1; }
          fi

      # Entry 290 section 2 item 7: the nightly's signed publish gives the application and the share extension each its own profile,
      # proved with made-up values, since no Apple secret exists here.
      - name: The signing properties, a dry run
        run: sh ios/signing-dry-run.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-device-build
          path: |
            build-device.log
            build-device.binlog
          retention-days: 7

  # NOTES-FROM-PLANNING.md entry 315's amendment, sections 2 and 5, and section 2: GroupLab Dev (org.grouplab.app.dev), built from the same
  # sources with -p:GroupLabDev=true, checked to be its own application beside GroupLab, and made to run a scenario with nobody's hands.
  dev-simulator:
    name: GroupLab Dev on the iOS Simulator
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      # The repository has no global.json; the desktop's workflows take the newest .NET 10, and so does this.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The newest iOS workload wants the Xcode after 26 (27.0.10722 refused Xcode 26.6), so the workload is held to the newest one made
      # for Xcode 26. The manifest's band is 10.0.100 whatever the SDK's band is.
      - name: The .NET iOS workload
        run: |
          ls -d /Applications/Xcode_26*.app | tr '\n' ' '; echo
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: Build GroupLab Dev for the simulator
        run: |
          dotnet build ios/GroupLab.iOS --configuration Release -r iossimulator-arm64 -p:GroupLabDev=true \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -bl:build-dev-simulator.binlog -v:minimal -clp:ErrorsOnly > build-dev-simulator.log 2>&1 || { grep -E "error" build-dev-simulator.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*iossimulator-arm64*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          # Everything two applications side by side cannot share is GroupLab Dev's own (scripts/ios-dev-app.py).
          said() { plutil -extract "$2" raw "$1/Info.plist" 2>/dev/null || echo "(absent)"; }
          appex="$app/PlugIns/GroupLab.Share.appex"
          echo "id $(said "$app" CFBundleIdentifier), name $(said "$app" CFBundleDisplayName), address $(said "$app" CFBundleURLTypes.0.CFBundleURLSchemes.0), extension $(said "$appex" CFBundleIdentifier)"
          test "$(said "$app" CFBundleIdentifier)" = "org.grouplab.app.dev" || { echo "::error::GroupLab Dev is not org.grouplab.app.dev"; exit 1; }
          test "$(said "$app" CFBundleDisplayName)" = "GroupLab Dev" || { echo "::error::GroupLab Dev is not named GroupLab Dev under its icon"; exit 1; }
          test "$(said "$app" CFBundleURLTypes.0.CFBundleURLSchemes.0)" = "grouplab-dev" || { echo "::error::GroupLab Dev answers GroupLab's own address"; exit 1; }
          test "$(said "$appex" CFBundleIdentifier)" = "org.grouplab.app.dev.share" || { echo "::error::GroupLab Dev's share extension has the wrong id"; exit 1; }
          codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q "group.org.grouplab.app.dev" || echo "::warning::GroupLab Dev's signature does not show its app group"
          # The developer tools are in GroupLab Dev's shared library, and (the job iOS Simulator checks) not in GroupLab's.
          dll=$(find "$app" -name 'GroupLab.Mobile.dll' | head -1)
          if [ -n "$dll" ]; then
            grep -c "GroupLab.Mobile.Dev" "$dll" || { echo "::error::GroupLab Dev's library carries no developer tools"; exit 1; }
          else
            echo "::notice::No GroupLab.Mobile.dll in the bundle to look into"
          fi

      - name: Boot an iOS 26 simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [(runtime, d) for runtime, ds in devices.items() if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")]
          found.sort(key=lambda p: (p[0], "Pro" in p[1]["name"], p[1]["name"]))
          print(found[-1][1]["udid"] if found else "")')
          test -n "$udid" || { xcrun simctl list runtimes; echo "::error::No iOS 26 iPhone simulator"; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "UDID=$udid" >> "$GITHUB_ENV"

      # Entry 315 section 2: a scenario run with nobody's hands. The sample scan (its consent is in samples/PROVENANCE.md) and a scenario
      # go into Documents/scenario; GroupLab Dev reads it at the start, runs it once, and writes results, screenshots, trees and its log
      # into Documents/scenario/results, which this copies off as a developer's script would from a device.
      - name: A scenario
        timeout-minutes: 20
        run: |
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.grouplab.app.dev
          sleep 15
          xcrun simctl terminate "$UDID" org.grouplab.app.dev || true
          data=$(xcrun simctl get_app_container "$UDID" org.grouplab.app.dev data)
          folder="$data/Documents/scenario"
          mkdir -p "$folder"
          cp samples/gl-cf25-ltr-d-25-shots-600-dpi.png "$folder/sample.png"
          cat > "$folder/scenario.json" <<'JSON'
          { "name": "read the sample and look around", "stopOnFailure": false, "caliber": "6.5 Creedmoor", "distanceInches": 3600,
            "steps": [
              { "do": "open", "place": "capture" },
              { "do": "screenshot", "name": "01-capture" },
              { "do": "tree", "name": "01-capture" },
              { "do": "picture", "file": "sample.png" },
              { "do": "wait", "screen": "FeedbackView|ResultView", "seconds": 300 },
              { "do": "screenshot", "name": "02-check" },
              { "do": "press", "name": "Use this picture|Use it anyway" },
              { "do": "wait", "screen": "ResultView", "seconds": 120 },
              { "do": "sleep", "seconds": 2 },
              { "do": "screenshot", "name": "03-result" },
              { "do": "tree", "name": "03-result" },
              { "do": "open", "place": "settings" },
              { "do": "wait", "text": "Send diagnostics", "seconds": 10 },
              { "do": "screenshot", "name": "04-settings" },
              { "do": "open", "place": "sessions" },
              { "do": "screenshot", "name": "05-sessions" },
              { "do": "log", "lines": 400 } ] }
          JSON
          xcrun simctl launch --console-pty "$UDID" org.grouplab.app.dev > dev-console.log 2>&1 &
          start=$(date +%s)
          status=""
          while [ $(( $(date +%s) - start )) -lt 900 ]; do
            status=$(cat "$folder/results/status" 2>/dev/null || true)
            [ "$status" = "done" ] && break
            sleep 5
          done
          echo "status after $(( $(date +%s) - start )) s: $status"
          xcrun simctl io "$UDID" screenshot dev-last-screen.png > /dev/null || true
          xcrun simctl terminate "$UDID" org.grouplab.app.dev || true
          mkdir -p scenario-results
          cp -R "$folder/results/." scenario-results/ 2>/dev/null || true
          test -f "$folder/scenario.json.ran" || { echo "::error::GroupLab Dev did not take the waiting scenario"; exit 1; }
          test -f scenario-results/results.json || { echo "::error::The scenario wrote no results (status: $status)"; tail -40 dev-console.log; exit 1; }
          python3 - <<'PY'
          import json, os
          results = json.load(open("scenario-results/results.json"))
          for step in results["steps"]:
              print(f"{step['step']:>2} {step['do']:<10} {'ok' if step['ok'] else 'FAILED':<6} {step['ms']:>7} ms  {step['detail']}")
          must = {("open", True), ("screenshot", True), ("tree", True), ("picture", True)}
          done = {(s["do"], s["ok"]) for s in results["steps"]}
          missing = [m for m in must if m not in done]
          shots = [f for f in os.listdir("scenario-results") if f.endswith(".png")]
          print(f"{len(shots)} screenshots: {', '.join(sorted(shots))}")
          if missing or not shots:
              raise SystemExit(f"::error::The scenario's basic steps did not all work: {missing}")
          if not results.get("ok"):
              print("::warning::A step of the scenario failed; the lines above say which")
          PY
          if grep -q '"do": "wait",' scenario-results/results.json && python3 -c 'import json,sys; r=json.load(open("scenario-results/results.json")); sys.exit(0 if any(s["do"]=="wait" and s["ok"] and "ResultView" in s["detail"] for s in r["steps"]) else 1)'; then
            echo "### GroupLab Dev read the sample in a scenario on the simulator, and reached its result." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### GroupLab Dev ran a scenario on the simulator; the sample's result was not reached (see the step lines)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Entry 342, worker A item 2: the screen sweep. scripts/scenarios/phone-sweep.json visits every place along the bottom and the pages one
      # press away (the caliber setup, Add a store-bought target, the printer check, a result from the sample scan, its shots and its
      # chronograph readings), with a screenshot and a control tree of each, three times: as the simulator is set, at the largest text size,
      # and dark. A run that ends before it writes its results, or a step that cannot find what it needs, fails the job. The same scenario
      # runs headlessly on every push first (PhoneSweepScenarioTests), so a renamed button is caught there.
      - name: The screen sweep
        timeout-minutes: 50
        run: |
          data=$(xcrun simctl get_app_container "$UDID" org.grouplab.app.dev data)
          folder="$data/Documents/scenario"
          failed=0
          for pass in plain largest-text dark; do
            case "$pass" in
              largest-text) xcrun simctl ui "$UDID" content_size extra-extra-extra-large ;;
              dark) xcrun simctl ui "$UDID" content_size large; xcrun simctl ui "$UDID" appearance dark ;;
            esac
            xcrun simctl terminate "$UDID" org.grouplab.app.dev || true
            mkdir -p "$folder"
            rm -rf "$folder/results" "$folder/scenario.json.ran"
            # The same sheet at 300 dpi: the 600 dpi scan took 52 s to read on the simulator and its dark pass hit the one-minute limit on a
            # reading (run 36996193435); the sweep is about the screens, not the reading's speed.
            sips -Z 3300 -s dpiWidth 300 -s dpiHeight 300 samples/gl-cf25-ltr-d-25-shots-600-dpi.png --out "$folder/sample.png" > /dev/null
            cp scripts/scenarios/phone-sweep.json "$folder/scenario.json"
            xcrun simctl launch --console-pty "$UDID" org.grouplab.app.dev > "sweep-$pass-console.log" 2>&1 &
            launcher=$!
            start=$(date +%s)
            status=""
            while [ $(( $(date +%s) - start )) -lt 900 ]; do
              status=$(cat "$folder/results/status" 2>/dev/null || true)
              [ "$status" = "done" ] && break
              if ! kill -0 "$launcher" 2>/dev/null; then
                echo "::error::GroupLab Dev ended during the sweep's $pass pass (status: $status)"
                failed=1
                break
              fi
              sleep 3
            done
            echo "$pass: status after $(( $(date +%s) - start )) s: $status"
            xcrun simctl io "$UDID" screenshot "sweep-$pass-last.png" > /dev/null || true
            xcrun simctl terminate "$UDID" org.grouplab.app.dev || true
            mkdir -p "sweep/$pass"
            cp -R "$folder/results/." "sweep/$pass/" 2>/dev/null || true
            python3 - "$pass" <<'PY' || failed=1
          import json, os, sys
          name = sys.argv[1]
          path = os.path.join("sweep", name, "results.json")
          if not os.path.exists(path):
              raise SystemExit(f"::error::The sweep's {name} pass wrote no results")
          results = json.load(open(path))
          may_find_nothing = ["Use this picture|Use it anyway"]
          bad = []
          for step in results["steps"]:
              ok = step["ok"] or any(m in step["detail"] for m in may_find_nothing)
              print(f"{name:<13}{step['step']:>3} {step['do']:<10} {'ok' if step['ok'] else 'FAILED':<6} {step['ms']:>7} ms  {step['detail']}")
              if not ok:
                  bad.append(f"{step['step']} {step['do']}: {step['detail']}")
          shots = [f for f in os.listdir(os.path.join("sweep", name)) if f.endswith(".png")]
          print(f"{name}: {len(shots)} screenshots")
          if bad or len(shots) < 11:
              raise SystemExit(f"::error::The sweep's {name} pass did not find what it needed: {'; '.join(bad) or 'too few screenshots'}")
          PY
          done
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl ui "$UDID" content_size large || true
          [ "$failed" = 0 ] && echo "### The screen sweep visited every place and its pages on the simulator, plain, at the largest text size and dark." >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-dev-simulator
          path: |
            scenario-results
            sweep
            sweep-*-console.log
            sweep-*-last.png
            dev-console.log
            dev-last-screen.png
            build-dev-simulator.log
            build-dev-simulator.binlog
          retention-days: 14
          if-no-files-found: warn
