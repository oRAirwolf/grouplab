name: testflight

# NOTES-FROM-PLANNING.md entry 310: TestFlight's GroupLab Team and Public Beta always on the same build. The nightly's iOS job uploads the
# build; this moves it on, a step at a time, with scripts/testflight.py: into Public Beta and submitted for Beta App Review, then into
# GroupLab Team once Public Beta's testers can install it. After every nightly it waits up to 30 minutes for Apple to finish processing the
# upload, on a small Linux runner rather than a Mac; every half hour it looks again, so an approval reaches the team within half an hour.
# It never fails for a missing group or key: it says so in the summary and does nothing.
on:
  workflow_run:
    workflows: ["nightly"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One at a time, and a run is never cut short: a half-finished step is picked up by the next run anyway, but two at once could submit twice.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  step:
    name: TestFlight groups on the same build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The token maker
        run: python -m pip install --quiet --disable-pip-version-check "pyjwt[crypto]==2.10.1"

      - name: One step
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: python scripts/testflight.py --run --wait-minutes ${{ github.event_name == 'workflow_run' && '30' || '0' }} | tee state-lines.txt

      # Entry 311 section 3 item 4: new beta feedback (a tester's screenshot shared from GroupLab) and crashes, a line each in this run's
      # summary, never a comment, a screenshot or a tester's email. Entry 326: each is also filed once in the private
      # oRAirwolf/grouplab-crash-reports with CRASH_REPORTS_TOKEN, which can write there and nowhere else; here only the count is said.
      # The hour a half-hourly run looks back overlaps the next; after a nightly it looks back a day, and by hand fourteen days. It never
      # fails the run.
      - name: TestFlight feedback and crashes
        if: always()
        continue-on-error: true
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          CRASH_REPORTS_TOKEN: ${{ secrets.CRASH_REPORTS_TOKEN }}
        # Entry 350: GitHub runs the half-hourly schedule as seldom as every three or four hours, so a scheduled run looks back a day; an
        # item already filed is known by its marker and never filed twice.
        run: python scripts/testflight-feedback.py --run --since-hours ${{ github.event_name == 'workflow_run' && '24' || github.event_name == 'schedule' && '24' || '336' }}

      # Entries 335 and 336: a state that changed goes to docs/notes/external-status.md, which both sessions read, as a "[notes] " commit
      # that starts no build. The same state again writes nothing.
      - name: Note a changed state
        if: always()
        shell: bash
        run: |
          [ -f state-lines.txt ] || exit 0
          grep -v '^::' state-lines.txt | grep -v 'Run it again' | python3 scripts/status-note.py --section testflight > said.txt
          if ! grep -q '^changed' said.txt; then echo "the state is as it was"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notes/external-status.md
          git commit -m "[notes] External status: testflight changed" -m "Written by the testflight workflow, entries 335 and 336."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::the changed state could not be pushed; the next run tries again"
