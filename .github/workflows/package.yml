# The packages themselves, in one place, NOTES-FROM-PLANNING.md entry 119 section 1 item 3: "do not copy the steps by hand into a second
# file". Both release.yml and nightly.yml call this, so a numbered release and a nightly are built by the same steps from the same
# script and cannot drift apart.
#
# It builds what a person downloads: the Windows installer, the Windows zip and the Linux tarball, each under two names, once carrying the
# version and the commit so a bug report names a build, and once under a stable name so a fixed address keeps working.
#
# Nothing new goes into a package. Entry 116's rule stands: the samples are already-public images with a consent record, and the friend's
# scan never.
name: package

on:
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build. Never a branch name: a package must be the commit that passed.'
        required: true
        type: string
      version:
        description: 'The version to name the assets by. Empty takes the one in Directory.Build.props.'
        required: false
        default: ''
        type: string
      train:
        description: 'The update train the build belongs to: nightly, beta or release. Empty leaves it a development build.'
        required: false
        default: 'development'
        type: string
    outputs:
      version:
        description: 'The version the assets are named by.'
        value: ${{ jobs.windows.outputs.version }}
      commit:
        description: 'The short commit the assets are named by.'
        value: ${{ jobs.windows.outputs.commit }}

jobs:
  windows:
    name: windows package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.name.outputs.version }}
      commit: ${{ steps.name.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version and the commit
        id: name
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The script checks the package carries its own runtime and the OpenCV native library by analysing its own generated sample with its
      # own grouplab.exe, so a package that cannot analyse never reaches a download. -RequireInstaller fails the build rather than shipping
      # one asset of the two, since Inno Setup is installed on this runner.
      - name: Build the package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ steps.name.outputs.version }}' -Commit '${{ steps.name.outputs.commit }}' -Train '${{ inputs.train }}' -RequireInstaller


      # NOTES-FROM-PLANNING.md entry 125 section 1: v0.2.0-nightly.12 was published with its train missing, so it called itself a development
      # build and would never have updated itself. The cause is fixed, but this is where the claim can be checked against the thing actually
      # being shipped. It reads the metadata out of the file rather than running it, so it works for any platform on any runner.
      - name: The build must be stamped for the train it was packaged for
        if: inputs.train != ''
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/GroupLab.Cli -- build-stamp "out/package/grouplab/GroupLab.App.dll" --expect "${{ inputs.train }}"

      - name: Say what it is
        shell: bash
        run: |
          {
            echo "### windows package"
            echo
            for f in out/package/*.zip out/package/*.exe; do
              [ -f "$f" ] && echo "- $(basename "$f"), $(du -h "$f" | cut -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: |
            out/package/*.zip
            out/package/*.exe
          # Entry 217 section 3.1: the nightly downloads these within its own run, so a day is enough.
          retention-days: 1

  # NOTES-FROM-PLANNING.md entry 147 section 3.1: the build list lives here, as a list, so adding a target really is a line.
  #
  # To add one, add a row. `rid` is the .NET runtime identifier, `os` the runner that builds it, and `label` the name a
  # person sees in the download. `optional` means a failure here does not stop the nightly publishing the others, which
  # is section 5.3: the Windows and Linux builds are what people actually run, and a macOS packaging problem must not
  # take them down with it.
  #
  # Everything is built on the platform it targets rather than cross-published, because the OpenCV native package is the
  # build host's own; ci.yml's tarball job says why at length.
  portable:
    name: ${{ matrix.target.label }} package
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.target.optional }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { rid: linux-x64, os: ubuntu-latest, label: linux-x64, bundle: false, optional: false }
          - { rid: osx-arm64, os: macos-latest, label: macos-arm64, bundle: true, optional: true }
          - { rid: osx-x64, os: macos-latest, label: macos-x64, bundle: true, optional: true }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version and the commit
        id: name
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/GroupLab.App --configuration Release -r "${{ matrix.target.rid }}" --self-contained -o publish/grouplab \
            "-p:Version=${{ steps.name.outputs.version }}" "-p:GroupLabTrain=${{ inputs.train }}"
          cp LICENSE THIRD-PARTY-NOTICES.md publish/grouplab/

      # Entry 147 section 1.2: a proper .app bundle. A bare executable runs from a terminal and behaves like a stranger in
      # the dock, which is not worth publishing. The bundle is built here rather than by a packaging tool so that what it
      # contains is readable, and scripts/macos-bundle.py is the one place its shape is decided.
      - name: Make the app bundle
        if: matrix.target.bundle
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/macos-bundle.py publish/grouplab out/bundle \
            --version "${{ steps.name.outputs.version }}" --arch "${{ matrix.target.label }}"

      - name: Pack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/package
          stem="grouplab-${{ steps.name.outputs.version }}-${{ matrix.target.label }}-${{ steps.name.outputs.commit }}"
          if [ "${{ matrix.target.bundle }}" = "true" ]; then
            tar -czf "out/package/$stem.tar.gz" -C out/bundle GroupLab.app
          else
            tar -czf "out/package/$stem.tar.gz" -C publish grouplab
          fi
          cp "out/package/$stem.tar.gz" "out/package/grouplab-${{ matrix.target.label }}.tar.gz"
          ls -la out/package

      # NOTES-FROM-PLANNING.md entry 125 section 1: v0.2.0-nightly.12 was published with its train missing, so it called
      # itself a development build and would never have updated itself. The cause is fixed, but this is where the claim
      # can be checked against the thing actually being shipped. It reads the metadata out of the file rather than
      # running it, so it works for any platform on any runner.
      - name: The build must be stamped for the train it was packaged for
        if: inputs.train != ''
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/GroupLab.Cli -- build-stamp "publish/grouplab/GroupLab.App.dll" --expect "${{ inputs.train }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.label }}-package
          path: out/package/*.tar.gz
          # Entry 217 section 3.1: the nightly downloads these within its own run, so a day is enough.
          retention-days: 1
