# The packages themselves, in one place, NOTES-FROM-PLANNING.md entry 119 section 1 item 3: "do not copy the steps by hand into a second
# file". Both release.yml and nightly.yml call this, so a numbered release and a nightly are built by the same steps from the same
# script and cannot drift apart.
#
# It builds what a person downloads: the Windows installer, the Windows zip and the Linux tarball, each under two names, once carrying the
# version and the commit so a bug report names a build, and once under a stable name so a fixed address keeps working.
#
# Nothing new goes into a package. Entry 116's rule stands: the samples are already-public images with a consent record, and the friend's
# scan never.
name: package

on:
  # Request 55: run by hand to prove the Mac signing and notarization on one commit without waiting for a nightly. It publishes nothing;
  # the packages stay the run's own artifacts.
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit to build.'
        required: true
        type: string
      version:
        description: 'The version to name the assets by. Empty takes the one in Directory.Build.props.'
        required: false
        default: ''
        type: string
      train:
        description: 'The update train: nightly, beta or release. Empty leaves it a development build.'
        required: false
        default: 'development'
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build. Never a branch name: a package must be the commit that passed.'
        required: true
        type: string
      version:
        description: 'The version to name the assets by. Empty takes the one in Directory.Build.props.'
        required: false
        default: ''
        type: string
      train:
        description: 'The update train the build belongs to: nightly, beta or release. Empty leaves it a development build.'
        required: false
        default: 'development'
        type: string
    # Entry 306: the Mac build is signed with a Developer ID and notarized when these are set (request 55), and left unsigned otherwise.
    secrets:
      MACOS_DEVID_CERT_P12:
        required: false
      MACOS_DEVID_CERT_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
    outputs:
      version:
        description: 'The version the assets are named by.'
        value: ${{ jobs.windows.outputs.version }}
      commit:
        description: 'The short commit the assets are named by.'
        value: ${{ jobs.windows.outputs.commit }}

jobs:
  windows:
    name: windows package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.name.outputs.version }}
      commit: ${{ steps.name.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version and the commit
        id: name
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The script checks the package carries its own runtime and the OpenCV native library by analysing its own generated sample with its
      # own grouplab.exe, so a package that cannot analyse never reaches a download. -RequireInstaller fails the build rather than shipping
      # one asset of the two, since Inno Setup is installed on this runner.
      - name: Build the package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ steps.name.outputs.version }}' -Commit '${{ steps.name.outputs.commit }}' -Train '${{ inputs.train }}' -RequireInstaller


      # NOTES-FROM-PLANNING.md entry 125 section 1: v0.2.0-nightly.12 was published with its train missing, so it called itself a development
      # build and would never have updated itself. The cause is fixed, but this is where the claim can be checked against the thing actually
      # being shipped. It reads the metadata out of the file rather than running it, so it works for any platform on any runner.
      - name: The build must be stamped for the train it was packaged for
        if: inputs.train != ''
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/GroupLab.Cli -- build-stamp "out/package/grouplab/GroupLab.App.dll" --expect "${{ inputs.train }}"

      - name: Say what it is
        shell: bash
        run: |
          {
            echo "### windows package"
            echo
            for f in out/package/*.zip out/package/*.exe; do
              [ -f "$f" ] && echo "- $(basename "$f"), $(du -h "$f" | cut -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: |
            out/package/*.zip
            out/package/*.exe
          # Entry 217 section 3.1: the nightly downloads these within its own run, so a day is enough.
          retention-days: 1

  # NOTES-FROM-PLANNING.md entry 147 section 3.1: the build list lives here, as a list, so adding a target really is a line.
  #
  # To add one, add a row. `rid` is the .NET runtime identifier, `os` the runner that builds it, and `label` the name a
  # person sees in the download. `optional` means a failure here does not stop the nightly publishing the others, which
  # is section 5.3: the Windows and Linux builds are what people actually run, and a macOS packaging problem must not
  # take them down with it.
  #
  # Everything is built on the platform it targets rather than cross-published, because the OpenCV native package is the
  # build host's own; ci.yml's tarball job says why at length.
  portable:
    name: ${{ matrix.target.label }} package
    runs-on: ${{ matrix.target.os }}
    # 90, not 60: Apple's notarization of the Mac build can take most of an hour on a slow day.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.target.optional }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { rid: linux-x64, os: ubuntu-latest, label: linux-x64, bundle: false, optional: false }
          - { rid: osx-arm64, os: macos-latest, label: macos-arm64, bundle: true, optional: true }
          - { rid: osx-x64, os: macos-latest, label: macos-x64, bundle: true, optional: true }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version and the commit
        id: name
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/GroupLab.App --configuration Release -r "${{ matrix.target.rid }}" --self-contained -o publish/grouplab \
            "-p:Version=${{ steps.name.outputs.version }}" "-p:GroupLabTrain=${{ inputs.train }}"
          cp LICENSE THIRD-PARTY-NOTICES.md publish/grouplab/

      # Entry 147 section 1.2: a proper .app bundle. A bare executable runs from a terminal and behaves like a stranger in
      # the dock, which is not worth publishing. The bundle is built here rather than by a packaging tool so that what it
      # contains is readable, and scripts/macos-bundle.py is the one place its shape is decided.
      - name: Make the app bundle
        if: matrix.target.bundle
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/macos-bundle.py publish/grouplab out/bundle \
            --version "${{ steps.name.outputs.version }}" --arch "${{ matrix.target.label }}"

      # NOTES-FROM-PLANNING.md entry 306: sign with the Developer ID and the hardened runtime, notarize, and staple, so macOS opens GroupLab
      # with no Terminal command first. scripts/macos-signing.py decides from the six secrets: none of the Mac's own set leaves the build
      # unsigned as before, all six right signs it, and a missing or malformed one fails naming the secret, never its value.
      - name: The Mac signing secrets
        id: macsign
        if: matrix.target.bundle
        shell: bash
        env:
          MACOS_DEVID_CERT_P12: ${{ secrets.MACOS_DEVID_CERT_P12 }}
          MACOS_DEVID_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set +e
          python3 scripts/macos-signing.py --check
          code=$?
          set -e
          [ $code -eq 1 ] && { echo "::error::A Mac signing secret is missing or malformed; the lines above name it. Nothing was signed."; exit 1; }
          if [ $code -eq 3 ]; then echo "### macOS: no Developer ID yet, so this build is not signed or notarized (request 55)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Sign, notarize and staple
        if: matrix.target.bundle && steps.macsign.outputs.sign == 'true'
        shell: bash
        env:
          MACOS_DEVID_CERT_P12: ${{ secrets.MACOS_DEVID_CERT_P12 }}
          MACOS_DEVID_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          app=out/bundle/GroupLab.app
          keychain="$RUNNER_TEMP/devid.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_DEVID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$MACOS_DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$identity" || { echo "::error::The certificate is not a Developer ID Application certificate"; exit 1; }

          # Inside out, then the bundle itself with the entitlements .NET needs. codesign counts every file in Contents/MacOS as code, the
          # .NET libraries included (their signature goes in extended attributes, which ditto and the Mac's own tar carry), and signing the
          # main executable before all of them are signed fails. Nightly 134 did: "code object is not signed at all, in subcomponent
          # System.Diagnostics.Contracts.dll". So every file there is signed but the main executable, which is signed with the bundle.
          main="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          find "$app/Contents" -type f | while read -r f; do
            if [ "$f" = "$main" ]; then continue; fi
            case "$f" in
              "$app/Contents/MacOS/"*) sign=yes ;;
              *) if file "$f" | grep -q "Mach-O"; then sign=yes; else sign=no; fi ;;
            esac
            if [ "$sign" = yes ]; then
              codesign --force --timestamp --options runtime --entitlements scripts/macos/GroupLab.entitlements --sign "$identity" "$f"
            fi
          done
          codesign --force --timestamp --options runtime --entitlements scripts/macos/GroupLab.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          mkdir -p "$HOME/private_keys"
          key="$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          fi
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/GroupLab-notarize.zip"
          # A rejection prints Apple's own reasons, one per file, so a failed night says what to fix without a second run to ask.
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/GroupLab-notarize.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 45m 2>&1 | tee notarize.log
          set -e
          id=$(grep -m1 -oE "id: [0-9a-f-]{36}" notarize.log | cut -d' ' -f2 || true)
          status=$(grep -oE "status: (Accepted|Invalid|Rejected)" notarize.log | tail -1 | cut -d' ' -f2 || true)
          # --wait gives up on the first status request that fails while Apple is still working: the first run by hand stopped on "The
          # request timed out" with the submission in progress. So where it ended with no answer, ask again every 30 seconds, a failed
          # request simply retried, until Apple answers or 45 minutes pass.
          if [ -z "$status" ] && [ -n "$id" ]; then
            for _ in $(seq 90); do
              status=$(xcrun notarytool info "$id" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --team-id "$APPLE_TEAM_ID" \
                --output-format json 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)
              echo "Notarization: ${status:-no answer to this request}"
              case "$status" in Accepted|Invalid|Rejected) break ;; esac
              sleep 30
            done
          fi
          if [ "$status" != "Accepted" ]; then
            if [ -n "$id" ] && [ -n "$status" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --team-id "$APPLE_TEAM_ID" \
                notarize-issues.json > /dev/null 2>&1 || true
              python3 -c 'import json; [print("::error::" + str(i.get("path")) + ": " + str(i.get("message"))) for i in (json.load(open("notarize-issues.json")).get("issues") or [])[:40]]' || true
            fi
            rm -f "$key"
            echo "::error::Apple did not accept the notarization; the lines above give its reasons"
            exit 1
          fi
          rm -f "$key" "$RUNNER_TEMP/GroupLab-notarize.zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          # Gatekeeper's own assessment, the check entry 306 section 4 waits for before the Terminal command leaves the instructions.
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee gatekeeper.log
          echo "### macOS ${{ matrix.target.label }}: signed, notarized and stapled. Gatekeeper: $(head -1 gatekeeper.log)" >> "$GITHUB_STEP_SUMMARY"
          security delete-keychain "$keychain"

      - name: Pack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/package
          stem="grouplab-${{ steps.name.outputs.version }}-${{ matrix.target.label }}-${{ steps.name.outputs.commit }}"
          if [ "${{ matrix.target.bundle }}" = "true" ]; then
            tar -czf "out/package/$stem.tar.gz" -C out/bundle GroupLab.app
          else
            tar -czf "out/package/$stem.tar.gz" -C publish grouplab
          fi
          cp "out/package/$stem.tar.gz" "out/package/grouplab-${{ matrix.target.label }}.tar.gz"
          ls -la out/package

      # NOTES-FROM-PLANNING.md entry 125 section 1: v0.2.0-nightly.12 was published with its train missing, so it called
      # itself a development build and would never have updated itself. The cause is fixed, but this is where the claim
      # can be checked against the thing actually being shipped. It reads the metadata out of the file rather than
      # running it, so it works for any platform on any runner.
      - name: The build must be stamped for the train it was packaged for
        if: inputs.train != ''
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/GroupLab.Cli -- build-stamp "publish/grouplab/GroupLab.App.dll" --expect "${{ inputs.train }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.label }}-package
          path: out/package/*.tar.gz
          # Entry 217 section 3.1: the nightly downloads these within its own run, so a day is enough.
          retention-days: 1
