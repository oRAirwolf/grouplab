# Publishing grouplab.org, NOTES-FROM-PLANNING.md entry 144, which replaces entry 128 section 6's rule that nothing publishes the site by
# itself.
#
# **The site publishes itself when its content changes.** A push to main that touches anything the site is built from builds, signs and
# publishes it. That rule was the other way round until entry 144, and it was right while none of the machinery had been proved: the
# signature check, the live check and the rollback have now each done their job on real publishes, including a rollback that saved the live
# site. What was left of the old rule was only cost, and a night's work sat unpublished with release notes nine builds behind because
# publishing needed a person to ask.
#
# **What is visible is still controlled, by the content rather than by the pipeline.** A research article appears when its own state says
# published, which only Alan agrees to, and an unfinished page is simply not marked ready. To stop a publish there is no dispatch to
# withhold: change the page's state, or push a fix. docs/WEBSITE.md says so in those words.
#
# **This does not wait on "build and test".** The site's gate is its own: the build, and the tests that can actually tell whether a page is
# wrong. A C# test failing on Windows says nothing about whether an article quotes a constant the code no longer uses.
#
# It does not deploy either. It builds the site, signs it, and puts it in a rolling release. The server pulls from there on its own timer,
# checks the signature, and installs it (website/server/). So GitHub holds no key, no server address and no password, and the server needs no
# inbound access at all.
name: website

on:
  # Entry 144 section 1.1: the content decides. Every path here is something the built site is made from, and nothing else starts a publish,
  # so an ordinary code commit does not republish the website.
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/RELEASE-NOTES.md'
      - 'docs/GLOSSARY.md'
      - 'docs/USER-GUIDE.md'
      - 'docs/TESTING-GUIDE.md'
      - 'docs/USER-GUIDE.pdf'
      - 'docs/TESTING-GUIDE.pdf'
      - 'docs/figures/screens/**'
      - 'targets/**'
      - '.github/workflows/website.yml'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the site is being published, in one line. It goes in the release notes.'
        required: false
        type: string

permissions:
  contents: write

# Entry 144 section 1.3: one publish at a time, newest wins, so a burst of commits publishes once rather than queueing a publish each.
#
# Cancelling mid-upload cannot serve half a site. The worst it can leave in the release is a new archive beside an old signature, and the
# server refuses a parcel whose signature does not verify and goes on serving what it has. So the failure mode is a publish that waits for
# the next run, which is the one that was going to replace it anyway.
concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    name: build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # A dispatch says why in its own words. A push says it with the commit that caused it, which is the same question answered by the
      # thing that answered it.
      REASON: "${{ inputs.reason || format('pushed, {0}', github.event.head_commit.message) }}"
    steps:
      # main, not the branch this was started from: the site is what has landed, never what is being worked on.
      - uses: actions/checkout@v5
        with:
          ref: main
          # NOTES-FROM-PLANNING.md entry 136 section 2.4: the build refuses to publish a release notes page that has fallen behind the tags,
          # and it reads the tags from the checkout rather than the network, so the checkout has to carry them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The builder's packages
        run: python -m pip install --quiet markdown Pillow fonttools brotli

      - name: Build the site
        run: python website/build.py

      # Entry 144 section 1.2: the site's own gate. These are the checks that can tell whether a page is wrong: an article quoting a
      # constant the code no longer uses, an em dash or a banned term, a figure with no sample size, a releases page that has fallen behind
      # the tags, a render nobody declared, or a link to the old site. A minute or two, and none of it waits on a Windows test run, because
      # a C# test failing on Windows says nothing about whether a page is right.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: The site's own tests
        run: >
          dotnet test tests/GroupLab.Core.Tests
          --filter "FullyQualifiedName~ResearchArticleTests|FullyQualifiedName~ReleaseNotesTests|FullyQualifiedName~NoPissinhotOnTheSiteTests|FullyQualifiedName~PublishedRendersTests|FullyQualifiedName~WebsiteWorkflowTests|FullyQualifiedName~SiteSyncTests|FullyQualifiedName~SupportLinkTests"
          --logger "console;verbosity=minimal"

      # Every page carries the commit it was built from, and the server checks that the page it is serving afterwards carries this one.
      - name: The commit it was built from must be in every page
        run: |
          set -o pipefail
          short=$(git rev-parse HEAD)
          missing=0
          while IFS= read -r page; do
            if ! grep -q "grouplab-site-build\" content=\"$short\"" "$page"; then
              echo "::error::$page does not carry the build commit"
              missing=1
            fi
          done < <(find website/_site -name '*.html')
          test "$missing" -eq 0
          echo "every page carries $short"

      - name: Pack it
        run: |
          set -o pipefail
          tar -czf grouplab-site.tar.gz -C website/_site .
          sha256sum grouplab-site.tar.gz | cut -d' ' -f1 > grouplab-site.tar.gz.sha256
          echo "packed $(du -h grouplab-site.tar.gz | cut -f1), sha256 $(cat grouplab-site.tar.gz.sha256)"

      # Entry 128 section 3.3: the SHA-256 only proves the file arrived whole. The signature proves it came from this project's build, which
      # is what the server needs before it will unpack anything into a web root. Same key as the update manifest, so no new secret exists.
      - name: Sign it
        env:
          GROUPLAB_UPDATE_SIGNING_KEY: ${{ secrets.GROUPLAB_UPDATE_SIGNING_KEY }}
        run: |
          set -o pipefail
          if [ -z "$GROUPLAB_UPDATE_SIGNING_KEY" ]; then
            echo "::error::the repository secret GROUPLAB_UPDATE_SIGNING_KEY is not set, so this site cannot be signed and will not be published."
            exit 1
          fi
          printf '%s' "$GROUPLAB_UPDATE_SIGNING_KEY" | base64 -d > private.der
          openssl pkcs8 -inform DER -nocrypt -in private.der -out private.pem
          openssl dgst -sha256 -sign private.pem -out grouplab-site.tar.gz.sig grouplab-site.tar.gz
          # Checked here with the public half the application carries, so a key that cannot verify its own signature fails before publishing.
          python - <<'PY' > public.pem
          import re
          text = open('src/GroupLab.Core/Updates/UpdateKeys.cs', encoding='utf-8').read()
          key = re.search(r'PublicKey\s*=\s*"([A-Za-z0-9+/=]+)"', text).group(1)
          print('-----BEGIN PUBLIC KEY-----')
          for i in range(0, len(key), 64):
              print(key[i:i + 64])
          print('-----END PUBLIC KEY-----')
          PY
          openssl dgst -sha256 -verify public.pem -signature grouplab-site.tar.gz.sig grouplab-site.tar.gz
          shred -u private.der private.pem

      # A rolling release, replacing its assets each time. It is a pre-release and never latest, so it cannot be mistaken for a build of the
      # application, and the nightly's "keep the newest thirty" never touches it because its tag is not a version.
      - name: Publish to the site release
        run: |
          set -o pipefail
          notes=$(printf '%s\n\n%s\n' "Built from $(git rev-parse HEAD)." "Why: $REASON")
          if gh release view site >/dev/null 2>&1; then
            gh release edit site --notes "$notes" --prerelease --latest=false
            gh release upload site grouplab-site.tar.gz grouplab-site.tar.gz.sha256 grouplab-site.tar.gz.sig --clobber
          else
            gh release create site \
              --title "grouplab.org" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              grouplab-site.tar.gz grouplab-site.tar.gz.sha256 grouplab-site.tar.gz.sig
          fi

      - name: Say what it published
        run: |
          {
            echo "### grouplab.org published"
            echo
            echo "- commit $(git rev-parse HEAD)"
            echo "- why: $REASON"
            echo "- sha256 $(cat grouplab-site.tar.gz.sha256)"
            echo "- the server pulls it on its own timer"
          } >> "$GITHUB_STEP_SUMMARY"
