# A nightly build after every green push, NOTES-FROM-PLANNING.md entry 119 section 2. Alan asked whether new versions reach the Releases page
# on their own; they did not, so until somebody tagged a version the README's download links returned 404. This publishes the newest tested
# build on the nightly train, so a tester always has something current and nobody has to remember to release it.
#
# It publishes only what passed. The trigger is the completion of "build and test", and the jobs run only when that run succeeded, so a commit
# that fails on any of the three operating systems publishes nothing. It builds the workflow run's own head commit rather than the branch head,
# so the thing published is the thing that was tested.
#
# Two releases per build:
#   - v<version>, a pre-release of its own, keeping the versioned assets, so a bug report names a build that still exists;
#   - nightly, a rolling pre-release moved to the newest build, keeping the stable asset names, which is what the README links to. Its
#     addresses never change: https://github.com/oRAirwolf/grouplab/releases/download/nightly/<stable name>
#
# Both are pre-releases, so GitHub's releases/latest is left for a numbered release, which is a deliberate act (entry 119 section 8).
#
# The packages are package.yml, which release.yml calls too, so a nightly and a numbered release cannot drift apart.
name: nightly

on:
  workflow_run:
    workflows: ["build and test"]
    types: [completed]
    # main only, and that is a fix rather than a narrowing. Every push here pushes phase-1 and main at the same commit, so "build and test"
    # ran twice on the same code, each run triggered a nightly, and the concurrency rule cancelled the first. Half the nightly runs on
    # 2026-09-21 were cancellations of a run that was already building the right commit. main is force-set to the tested commit, so one
    # nightly per push is all that was ever wanted.
    branches: [main]

  # Entry 141 section 2.3: a guaranteed nightly. The workflow_run path only fires when a push happens, so a quiet day produces no build at
  # all, and a day whose runs were cancelled produces none either. This builds the newest commit on main that "build and test" passed on,
  # and does nothing where that commit already has one.
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

# Two quick pushes must not interleave: the newest wins and the older is cancelled where it has not finished.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # The version is worked out once and both the package and the publish use it, so the assets, the tag and the manifest cannot disagree.
  name-it:
    name: name the build
    # Entry 144 section 2.2, the other half of the guard. ci.yml skips every job on a notes commit, and a run whose jobs were all skipped
    # still completes as a success, which would start a nightly, which would write notes, which would start another. So the nightly checks
    # the marker too. A schedule has no workflow_run, and the empty subject does not match, so the daily build is unaffected.
    if: >-
      (github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
      && !startsWith(github.event.workflow_run.head_commit.message, '[notes] ')
      && !startsWith(github.event.workflow_run.head_commit.message, '[screens] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.name.outputs.version }}
      commit: ${{ steps.name.outputs.commit }}
      signing: ${{ steps.key.outputs.present }}
      fresh: ${{ steps.fresh.outputs.fresh }}
      sha: ${{ steps.pick.outputs.sha }}
      application-changed: ${{ steps.gate.outputs.application-changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Which commit this nightly is for. On the workflow_run path it is the commit that was tested. On the schedule it is the newest commit
      # on main that "build and test" passed on, and where that commit already carries a per-build tag there is nothing to do: a scheduled run
      # exists to catch a day with no push, not to publish the same code twice.
      - name: Which commit this nightly is for
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&event=push&per_page=1" \
              -q '.workflow_runs[0].head_sha')
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "todo=no" >> "$GITHUB_OUTPUT"
              echo "::notice::no successful build and test run on main to publish, so this scheduled nightly does nothing."
              echo "### nothing to publish: no successful build and test run on main" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # for-each-ref rather than the porcelain listing command, which a test forbids in this file. An annotated tag names its commit
            # in *objectname and a lightweight one in objectname, so both are read.
            tagged() { git for-each-ref --format='%(objectname)' 'refs/tags/v*-nightly.*'; git for-each-ref --format='%(*objectname)' 'refs/tags/v*-nightly.*'; }
            if tagged | grep -qx "$sha"; then
              echo "todo=no" >> "$GITHUB_OUTPUT"
              echo "::notice::${sha:0:7} already has a nightly, so this scheduled run does nothing."
              {
                echo "### nothing to publish: the newest tested commit already has a nightly"
                echo
                echo "The newest commit on main that \`build and test\` passed on is \`${sha:0:7}\`, and it already carries a per-build tag."
                echo "A scheduled nightly exists to catch a day with no push, not to publish the same code twice."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi

          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "todo=yes" >> "$GITHUB_OUTPUT"
          echo "this nightly is for ${sha:0:7}"

      # A nightly that is no longer the head of main publishes nothing, and says so rather than failing.
      #
      # This is not tidiness. GITHUB_TOKEN cannot hold the `workflows` permission, so GitHub refuses to let it create a ref on a commit whose
      # `.github/workflows` differ from the default branch's. Creating the release tag is creating a ref, so a nightly for a commit that main
      # has since moved past, over a push that touched a workflow file, is refused with `HTTP 403: Resource not accessible by integration` on
      # POST /releases. That is exactly what happened to v0.2.0-nightly.22 on 2026-09-21: it built 4bd78e7 while main had moved to 0cf5ad1,
      # which added website.yml and changed ci.yml.
      #
      # GitHub says so itself. With GH_DEBUG=api on, the refused POST /repos/oRAirwolf/grouplab/releases came back with
      #
      #     X-Accepted-Github-Permissions: contents=write; contents=write,workflows=write
      #
      # That header lists the permission sets the request would be accepted with. The token held contents=write and was still refused, so the
      # set GitHub wanted was the second one, and no GITHUB_TOKEN can hold workflows=write.
      #
      # The evidence for that reading, from the five nightlies of that day: the four that published had no workflow file differing from main's
      # head at the time, including v0.2.0-nightly.18, which tagged a commit that was already two pushes behind and succeeded because the
      # workflows matched. Only the one with two differing workflow files was refused.
      #
      # So the condition here is the broader one, and deliberately so: not main's head at all, rather than only a workflow difference. It is
      # simpler to reason about, it cannot be wrong in the dangerous direction, and nothing is lost, because the push that moved main brings
      # its own nightly for newer code.
      - name: Only the newest commit on main is published
        id: fresh
        if: steps.pick.outputs.todo == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -o pipefail
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$head" = "$SHA" ]; then
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
            echo "this is the head of main, so it is the build to publish"
            exit 0
          fi

          echo "fresh=no" >> "$GITHUB_OUTPUT"
          {
            echo "### nothing published: main has moved on"
            echo
            echo "This run tested \`${SHA:0:7}\`, and main is now \`${head:0:7}\`."
            echo
            echo "A nightly only publishes the newest commit on main. The push that moved main has a nightly of its own, and that one carries"
            echo "the newer code, so publishing this would put an older build on the nightly train and then immediately replace it."
            echo
            echo "It also could not publish if it tried. \`GITHUB_TOKEN\` cannot hold the \`workflows\` permission, so GitHub refuses to let it"
            echo "create a ref on a commit whose \`.github/workflows\` differ from the default branch. Creating the release tag is creating a ref."
            echo "See NOTES-FROM-PLANNING.md entry 123 section 1."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::main has moved from ${SHA:0:7} to ${head:0:7}, so this nightly publishes nothing. The newer push brings its own."

      # The gate, NOTES-FROM-PLANNING.md entry 150 section 2. Alan, reading the releases page: a lot of builds were release note pages being
      # brought up to date or research articles being written, and every one of them compiled and tested a new executable on three operating
      # systems. A build is for a change to the application; everything else is content and publishes through the site path entry 144 built.
      #
      # A scheduled workflow gets no paths filter, so this is a job output every later job depends on rather than a filter on the trigger.
      # `.github/shipping-paths.json` is the one list of which paths are which, read here and by ShippingPathsTests, so the two cannot drift.
      # A path in neither list fails the gate on purpose: a new top level directory should make somebody decide which side it is on.
      - name: Did anything that ships inside the executable change
        id: gate
        if: steps.pick.outputs.todo == 'yes'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -o pipefail
          # for-each-ref rather than the porcelain listing command, which a test forbids in this file. An annotated tag names its commit in
          # *objectname and a lightweight one in objectname, so both are read.
          previous=$(git for-each-ref --sort=-creatordate --format='%(objectname) %(*objectname) %(refname:strip=2)' \
            'refs/tags/v*-nightly.*' | awk -v sha="$SHA" '{ c = ($2 ~ /^[0-9a-f]{40}$/ ? $2 : $1); n = $NF; if (c != sha) { print c, n; exit } }')
          base=$(echo "$previous" | cut -d' ' -f1)
          tag=$(echo "$previous" | cut -d' ' -f2)
          if [ -z "$base" ]; then
            echo "application-changed=yes" >> "$GITHUB_OUTPUT"
            echo "there is no earlier nightly to compare against, so this one is built"
            exit 0
          fi

          if ! out=$(python3 scripts/shipping-gate.py --decide "$base" "$SHA" 2>&1); then
            echo "$out"
            echo "::error::a changed path is in neither list in .github/shipping-paths.json. Decide which side it is on and add it."
            exit 1
          fi
          echo "$out"

          verdict=$(printf '%s\n' "$out" | head -1 | cut -d= -f2)
          echo "application-changed=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" != "yes" ]; then
            number=${tag##*-nightly.}
            echo "::notice::no application change since nightly ${number}. No build produced."
            {
              echo "### No application change since nightly ${number}. No build produced."
              echo
              echo "Everything that changed since that build is content: the website, the documentation, the release notes or the research"
              echo "articles. Content publishes through the site and never produces an executable. NOTES-FROM-PLANNING.md entry 150."
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Entry 150 section 6.3: the gate's logic exercised against the real history rather than against a fixture, every night, printed where
      # somebody reading a run can see what it would have done. It never fails the run; it is a measurement.
      - name: What the gate would have done to the last thirty nightlies
        if: steps.pick.outputs.todo == 'yes'
        continue-on-error: true
        run: |
          {
            echo "<details><summary>What the gate would have done to the last thirty nightlies</summary>"
            echo
            echo '```'
            python3 scripts/shipping-gate.py --history 30 || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Entry 150 section 2.4: nightly numbers count builds, not days, so a skipped night does not consume one. The number is the highest
      # nightly tag that exists plus one, rather than this workflow's run number, which counts every run including the ones that built
      # nothing. That is why the published numbers already jump: 14 to 16 to 18 to 25.
      - name: Work out the version
        id: name
        if: steps.pick.outputs.todo == 'yes' && steps.gate.outputs.application-changed == 'yes'
        run: |
          base=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2)
          last=$(git for-each-ref --format='%(refname:strip=2)' 'refs/tags/v*-nightly.*' | sed 's/.*-nightly\.//' | sort -n | tail -1)
          echo "version=${base}-nightly.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short ${{ steps.pick.outputs.sha }})" >> "$GITHUB_OUTPUT"

      # Entry 119 section 3.2: no key, no publishing. It fails here, before anything is built, so the reason is the first thing in the log.
      - name: The signing key must be here
        id: key
        if: steps.pick.outputs.todo == 'yes' && steps.gate.outputs.application-changed == 'yes'
        env:
          GROUPLAB_UPDATE_SIGNING_KEY: ${{ secrets.GROUPLAB_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$GROUPLAB_UPDATE_SIGNING_KEY" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            {
              echo "### no update signing key, so nothing is published"
              echo
              echo "The repository secret \`GROUPLAB_UPDATE_SIGNING_KEY\` does not exist, so this build cannot sign its update manifest."
              echo "An unsigned manifest is one the application would have to trust without being able to check it, so the nightly train"
              echo "publishes nothing until the secret is set. \`docs/UPDATES.md\` has the steps."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the repository secret GROUPLAB_UPDATE_SIGNING_KEY is not set, so this nightly cannot be signed and will not be published. See docs/UPDATES.md."
            exit 1
          fi
          echo "present=yes" >> "$GITHUB_OUTPUT"

  package:
    name: package
    needs: name-it
    # Entry 150 section 2.2: every build, test, package and release job depends on the gate.
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.name-it.outputs.sha }}
      version: ${{ needs.name-it.outputs.version }}
      train: nightly

  publish:
    name: publish the nightly
    needs: [name-it, package]
    # Entry 150 section 2.2: every build, test, package and release job depends on the gate.
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.name-it.outputs.sha }}
      VERSION: ${{ needs.name-it.outputs.version }}
      COMMIT: ${{ needs.name-it.outputs.commit }}
    steps:
      # The whole history, so the notes can say what has changed since the previous nightly.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.name-it.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v6
        with:
          path: assets

      # NOTES-FROM-PLANNING.md entry 147 section 5.3: a macOS build that fails to package must not take the Windows and Linux ones
      # down with it, and the run must say which one is missing rather than publishing a shorter list quietly. So the builds people
      # actually run are required by name, and the untested ones are counted and reported.
      - name: Gather the assets
        run: |
          set -o pipefail
          mkdir -p release
          find assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release

          missing=""
          for needed in grouplab-setup-win-x64.exe grouplab-win-x64.zip grouplab-linux-x64.tar.gz; do
            test -f "release/$needed" || missing="$missing $needed"
          done
          if [ -n "$missing" ]; then
            echo "::error::these supported builds did not package, so this nightly is not published:$missing"
            exit 1
          fi

          absent=""
          for optional in grouplab-macos-arm64.tar.gz grouplab-macos-x64.tar.gz; do
            if [ ! -f "release/$optional" ]; then
              absent="$absent $optional"
              echo "::warning::$optional did not package; the rest of the nightly is published without it"
            fi
          done
          if [ -n "$absent" ]; then
            echo "MISSING_BUILDS=$absent" >> "$GITHUB_ENV"
            {
              echo "### macOS builds missing from this nightly"
              echo
              echo "$absent"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # What changed since the previous published build on this train, and nothing older.
      #
      # NOTES-FROM-PLANNING.md entry 138 section 2. This used to start from the rolling `nightly` tag, which moves: a run reading it could
      # see itself or an older build depending on when it looked. The per-build `v<version>-nightly.N` tags do not move, so the script finds
      # the newest one below this build itself. A nightly that was cancelled or skipped never got a tag, so its changes roll into this one,
      # which is what section 1 asks for. The tags have to be in the checkout for that, hence the fetch.
      - name: Write the notes
        run: |
          git fetch --quiet --tags origin 2>/dev/null || true
          python3 scripts/release-notes.py "$VERSION" "$SHA" > notes.md
          cat notes.md
          # Entry 139 section 3: each recent build's own notes, so the update bar can show somebody everything they skipped. They ride in
          # the second manifest format only, where a field an older build does not know is a field it ignores.
          python3 scripts/release-notes.py --versions versions.json "$VERSION" "$SHA"

      # Entry 145 section 3.3. The generator no longer hides a commit with no note in a count: it writes a line from the subject
      # instead. This is the other half of that, naming those commits in the build's own report, so a forgotten note is noticed on
      # the day by the person who wrote the commit rather than months later by somebody reading the website. It reports and does
      # not fail, because a note can be improved after a build and a build cannot be un-published.
      - name: Name any commit that wrote its own note
        run: |
          python3 scripts/release-notes.py --missing "$VERSION" "$SHA" | tee missing.txt
          {
            echo "### Notes written from a commit subject"
            echo
            echo "```"
            cat missing.txt
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"


      # The manifest: what this build is, what it offers, and the SHA-256 of every file, signed so the application can tell it from a forgery.
      - name: Write and sign the manifest
        env:
          GROUPLAB_UPDATE_SIGNING_KEY: ${{ secrets.GROUPLAB_UPDATE_SIGNING_KEY }}
        run: |
          set -o pipefail
          dotnet build src/GroupLab.Cli --configuration Release
          base="https://github.com/oRAirwolf/grouplab/releases/download/nightly"
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-manifest \
            --version "$VERSION" --train nightly --commit "$SHA" --notes notes.md --versions versions.json \
            --out release/update-manifest.json \
            --asset windows installer release/grouplab-setup-win-x64.exe "$base/grouplab-setup-win-x64.exe" \
            --asset windows zip release/grouplab-win-x64.zip "$base/grouplab-win-x64.zip" \
            --asset linux tarball release/grouplab-linux-x64.tar.gz "$base/grouplab-linux-x64.tar.gz"
          # Checked with the key compiled into the build being published, not with the key that signed it: that is the stronger question,
          # because a build that cannot verify its own updates is broken however well the manifest was signed. A commit from before the key
          # was set fails here by design, and the message says NoKey.
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-check release/update-manifest.json
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-check release/update-manifest-2.json

      # Entry 147 section 3.2: a release carrying a macOS asset carries the platform statement with it, generated from
      # docs/PLATFORM-SUPPORT.md like the download page and the README. Somebody who reaches a release straight from a link
      # has not read the download page, and the words that say nobody has run this on a Mac have to travel with the file.
      - name: The platform statement, on a release that carries a Mac build
        run: |
          set -o pipefail
          if ls release/grouplab-macos-*.tar.gz >/dev/null 2>&1; then
            {
              echo
              echo "---"
              echo
              python3 scripts/platform-support.py --release
            } >> notes.md
            echo "the platform statement is on this release, because it carries a macOS build"
          else
            echo "no macOS asset, so the platform statement is not on this release"
          fi

      # The build's own release, which keeps the versioned assets so a bug report names something that still exists.
      # GH_DEBUG=api is here because entry 123 section 1 step 3 asks for the exact request and response when this 403s, and it did again on
      # 2026-09-21 with the repository default already set to write, no rulesets and no tag protection. It prints headers and status, never
      # the token, which the runner masks.
      - name: Publish this build
        env:
          GH_DEBUG: api
        run: |
          gh release create "v$VERSION" \
            --title "GroupLab $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --target "$SHA" \
            release/update-manifest.json release/update-manifest-2.json release/grouplab-*-win-x64-*.exe release/grouplab-*-win-x64-*.zip release/grouplab-*-linux-x64-*.tar.gz $(ls release/grouplab-*-macos-*-*.tar.gz 2>/dev/null || true)

      # The rolling release the README links to. The tag moves to the tested commit and the old assets go with the old release, so a fixed
      # address never serves a stale file.
      - name: Move the nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "GroupLab nightly, $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --target "$SHA" \
            release/update-manifest.json release/update-manifest-2.json release/grouplab-setup-win-x64.exe release/grouplab-win-x64.zip release/grouplab-linux-x64.tar.gz $(ls release/grouplab-macos-*.tar.gz 2>/dev/null || true)

      # Entry 119 section 2.4: keep the newest 30 nightly releases and delete older ones with their tags. Only releases this workflow made,
      # matched by the shape of their tag, are ever touched: a beta, a release, or anything else is left alone.
      - name: Keep the newest thirty
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            | python3 -c "
          import json, re, subprocess, sys
          shape = re.compile(r'^v\d+\.\d+\.\d+-nightly\.\d+$')
          nightlies = [r['tagName'] for r in json.load(sys.stdin) if shape.match(r['tagName']) and r['isPrerelease']]
          nightlies.sort(key=lambda t: int(t.rsplit('.', 1)[1]), reverse=True)
          for tag in nightlies[30:]:
              print('removing ' + tag)
              subprocess.run(['gh', 'release', 'delete', tag, '--yes', '--cleanup-tag'], check=False)
          print(str(min(len(nightlies), 30)) + ' nightly releases kept')
          "

      # Entry 144 section 2: the notes write themselves. The generated entry is the floor, not the ceiling; improving its wording later is
      # an ordinary site content commit.
      #
      # The loop is guarded by the marker in the commit subject, which ci.yml and this workflow both skip on. That push does match
      # website.yml's paths filter, which is the point: the releases page follows within a couple of minutes without anybody asking.
      # Entry 144 section 2: the notes write themselves. The generated entry is the floor, not the ceiling; improving its wording later is
      # an ordinary site content commit.
      #
      # The loop is guarded by the marker in the commit subject, which ci.yml and this workflow both skip on. That push does match
      # website.yml's paths filter, which is the point: the releases page follows within a couple of minutes without anybody asking.
      - name: Write this build's notes into docs/RELEASE-NOTES.md
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          if grep -q "^## $VERSION$" docs/RELEASE-NOTES.md; then
            echo "$VERSION is already in the file, so nothing is appended."
            exit 0
          fi

          python3 scripts/release-notes.py "$VERSION" "$SHA" > body.md
          python3 - "$VERSION" "$SHA" <<'PY'
          import io, sys, datetime
          version, sha = sys.argv[1], sys.argv[2]
          nl = chr(10)
          body = io.open('body.md', encoding='utf-8').read()
          # The generator's first line names the build; the file's own heading does that, so it is not repeated.
          lines = [l for l in body.splitlines() if not l.startswith('GroupLab ')]
          entry = [
              '## ' + version,
              '',
              '**' + datetime.date.today().isoformat() + '**, commit `' + sha[:7] + '`. Nightly.',
              '',
              nl.join(lines).strip(),
              '',
              '[Downloads for this build](https://github.com/oRAirwolf/grouplab/releases/tag/v' + version + ')',
              '',
              '---',
              '',
              '',
          ]
          path = 'docs/RELEASE-NOTES.md'
          text = io.open(path, encoding='utf-8', newline='').read()
          # Newest first, directly under the horizontal rule that closes the file's preamble.
          rule = nl + '---' + nl
          at = text.index(rule) + len(rule)
          io.open(path, 'w', encoding='utf-8', newline='').write(text[:at] + nl + nl.join(entry) + text[at:].lstrip(nl))
          PY

          rm -f body.md
          git add docs/RELEASE-NOTES.md
          git commit -m "[notes] $VERSION" -m "Written by the nightly from this build's Release-note trailers, NOTES-FROM-PLANNING.md entry 144 section 2."
          git push origin main
          echo "appended $VERSION and pushed it; website.yml's paths filter picks it up"

      - name: Say what it is
        run: |
          {
            echo "### nightly $VERSION"
            echo
            echo "https://github.com/oRAirwolf/grouplab/releases/tag/nightly"
            echo
            for f in release/*; do
              echo "- $(basename "$f"), $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
