# A nightly build after every green push, NOTES-FROM-PLANNING.md entry 119 section 2. Alan asked whether new versions reach the Releases page
# on their own; they did not, so until somebody tagged a version the README's download links returned 404. This publishes the newest tested
# build on the nightly train, so a tester always has something current and nobody has to remember to release it.
#
# It publishes only what passed. The trigger is the completion of "build and test", and the jobs run only when that run succeeded, so a commit
# that fails on any of the three operating systems publishes nothing. It builds the workflow run's own head commit rather than the branch head,
# so the thing published is the thing that was tested.
#
# Two releases per build:
#   - v<version>, a pre-release of its own, keeping the versioned assets, so a bug report names a build that still exists;
#   - nightly, a rolling pre-release moved to the newest build, keeping the stable asset names, which is what the README links to. Its
#     addresses never change: https://github.com/oRAirwolf/grouplab/releases/download/nightly/<stable name>
#
# Both are pre-releases, so GitHub's releases/latest is left for a numbered release, which is a deliberate act (entry 119 section 8).
#
# The packages are package.yml, which release.yml calls too, so a nightly and a numbered release cannot drift apart.
name: nightly

on:
  workflow_run:
    workflows: ["build and test"]
    types: [completed]
    # main only, and that is a fix rather than a narrowing. Every push here pushes phase-1 and main at the same commit, so "build and test"
    # ran twice on the same code, each run triggered a nightly, and the concurrency rule cancelled the first. Half the nightly runs on
    # 2026-09-21 were cancellations of a run that was already building the right commit. main is force-set to the tested commit, so one
    # nightly per push is all that was ever wanted.
    branches: [main]

  # Entry 141 section 2.3: a guaranteed nightly. The workflow_run path only fires when a push happens, so a quiet day produces no build at
  # all, and a day whose runs were cancelled produces none either. This builds the newest commit on main that "build and test" passed on,
  # and does nothing where that commit already has one.
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

# Two quick pushes must not interleave: the newest wins and the older is cancelled where it has not finished.
# Entry 255: only a run that will build joins that group. On 2026-09-28 a build-and-test run cancelled by a newer push still started this
# workflow; the run skipped itself, as it should, but not before its place in the group had cancelled the real nightly for the commit
# before. A run that is going to skip (a failed or cancelled check, a [notes] or [screens] commit) gets a group of its own.
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success'
    && !startsWith(github.event.workflow_run.head_commit.message, '[notes] ')
    && !startsWith(github.event.workflow_run.head_commit.message, '[screens] ')))
    && 'nightly' || format('nightly-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # The version is worked out once and both the package and the publish use it, so the assets, the tag and the manifest cannot disagree.
  name-it:
    name: name the build
    # Entry 144 section 2.2, the other half of the guard. ci.yml skips every job on a notes commit, and a run whose jobs were all skipped
    # still completes as a success, which would start a nightly, which would write notes, which would start another. So the nightly checks
    # the marker too. A schedule has no workflow_run, and the empty subject does not match, so the daily build is unaffected.
    if: >-
      (github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
      && !startsWith(github.event.workflow_run.head_commit.message, '[notes] ')
      && !startsWith(github.event.workflow_run.head_commit.message, '[screens] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.name.outputs.version }}
      commit: ${{ steps.name.outputs.commit }}
      signing: ${{ steps.key.outputs.present }}
      fresh: ${{ steps.fresh.outputs.fresh }}
      sha: ${{ steps.pick.outputs.sha }}
      application-changed: ${{ steps.gate.outputs.application-changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Which commit this nightly is for. On the workflow_run path it is the commit that was tested. On the schedule it is the newest commit
      # on main that "build and test" passed on, and where that commit already carries a per-build tag there is nothing to do: a scheduled run
      # exists to catch a day with no push, not to publish the same code twice.
      - name: Which commit this nightly is for
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&event=push&per_page=1" \
              -q '.workflow_runs[0].head_sha')
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "todo=no" >> "$GITHUB_OUTPUT"
              echo "::notice::no successful build and test run on main to publish, so this scheduled nightly does nothing."
              echo "### nothing to publish: no successful build and test run on main" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # for-each-ref rather than the porcelain listing command, which a test forbids in this file. An annotated tag names its commit
            # in *objectname and a lightweight one in objectname, so both are read.
            tagged() { git for-each-ref --format='%(objectname)' 'refs/tags/v*-nightly.*'; git for-each-ref --format='%(*objectname)' 'refs/tags/v*-nightly.*'; }
            if tagged | grep -qx "$sha"; then
              echo "todo=no" >> "$GITHUB_OUTPUT"
              echo "::notice::${sha:0:7} already has a nightly, so this scheduled run does nothing."
              {
                echo "### nothing to publish: the newest tested commit already has a nightly"
                echo
                echo "The newest commit on main that \`build and test\` passed on is \`${sha:0:7}\`, and it already carries a per-build tag."
                echo "A scheduled nightly exists to catch a day with no push, not to publish the same code twice."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi

          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "todo=yes" >> "$GITHUB_OUTPUT"
          echo "this nightly is for ${sha:0:7}"

      # A nightly that is no longer the head of main publishes nothing, and says so rather than failing.
      #
      # This is not tidiness. GITHUB_TOKEN cannot hold the `workflows` permission, so GitHub refuses to let it create a ref on a commit whose
      # `.github/workflows` differ from the default branch's. Creating the release tag is creating a ref, so a nightly for a commit that main
      # has since moved past, over a push that touched a workflow file, is refused with `HTTP 403: Resource not accessible by integration` on
      # POST /releases. That is exactly what happened to v0.2.0-nightly.22 on 2026-09-21: it built 4bd78e7 while main had moved to 0cf5ad1,
      # which added website.yml and changed ci.yml.
      #
      # GitHub says so itself. With GH_DEBUG=api on, the refused POST /repos/oRAirwolf/grouplab/releases came back with
      #
      #     X-Accepted-Github-Permissions: contents=write; contents=write,workflows=write
      #
      # That header lists the permission sets the request would be accepted with. The token held contents=write and was still refused, so the
      # set GitHub wanted was the second one, and no GITHUB_TOKEN can hold workflows=write.
      #
      # The evidence for that reading, from the five nightlies of that day: the four that published had no workflow file differing from main's
      # head at the time, including v0.2.0-nightly.18, which tagged a commit that was already two pushes behind and succeeded because the
      # workflows matched. Only the one with two differing workflow files was refused.
      #
      # So the condition here is the broader one, and deliberately so: not main's head at all, rather than only a workflow difference. It is
      # simpler to reason about, it cannot be wrong in the dangerous direction, and nothing is lost, because the push that moved main brings
      # its own nightly for newer code.
      - name: Only the newest commit on main is published
        id: fresh
        if: steps.pick.outputs.todo == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -o pipefail
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$head" = "$SHA" ]; then
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
            echo "this is the head of main, so it is the build to publish"
            exit 0
          fi

          # Entry 210: main can move on only by "[notes] " or "[screens] " commits, which run no build and so bring no nightly of their own.
          # Standing down then left the application change before them with no nightly until the daily schedule. When every newer commit is
          # one of those, and none touches the workflows (the ref rule below), this build is still the newest application and is published.
          compare=$(gh api "repos/${{ github.repository }}/compare/${SHA}...${head}")
          building=$(jq -r '[.commits[].commit.message | split("\n")[0] | select((startswith("[notes] ") or startswith("[screens] ")) | not)] | length' <<<"$compare")
          workflows=$(jq -r '[.files[]?.filename | select(startswith(".github/workflows/"))] | length' <<<"$compare")
          if [ "$building" = "0" ] && [ "$workflows" = "0" ]; then
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
            echo "main moved from ${SHA:0:7} to ${head:0:7} only by notes or screenshots, which bring no nightly, so this build is published"
            exit 0
          fi

          echo "fresh=no" >> "$GITHUB_OUTPUT"
          {
            echo "### nothing published: main has moved on"
            echo
            echo "This run tested \`${SHA:0:7}\`, and main is now \`${head:0:7}\`."
            echo
            echo "A nightly only publishes the newest commit on main. The push that moved main has a nightly of its own, and that one carries"
            echo "the newer code, so publishing this would put an older build on the nightly train and then immediately replace it."
            echo
            echo "It also could not publish if it tried. \`GITHUB_TOKEN\` cannot hold the \`workflows\` permission, so GitHub refuses to let it"
            echo "create a ref on a commit whose \`.github/workflows\` differ from the default branch. Creating the release tag is creating a ref."
            echo "See NOTES-FROM-PLANNING.md entry 123 section 1."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::main has moved from ${SHA:0:7} to ${head:0:7}, so this nightly publishes nothing. The newer push brings its own."

      # The gate, NOTES-FROM-PLANNING.md entry 150 section 2. Alan, reading the releases page: a lot of builds were release note pages being
      # brought up to date or research articles being written, and every one of them compiled and tested a new executable on three operating
      # systems. A build is for a change to the application; everything else is content and publishes through the site path entry 144 built.
      #
      # A scheduled workflow gets no paths filter, so this is a job output every later job depends on rather than a filter on the trigger.
      # `.github/shipping-paths.json` is the one list of which paths are which, read here and by ShippingPathsTests, so the two cannot drift.
      # A path in neither list fails the gate on purpose: a new top level directory should make somebody decide which side it is on.
      - name: Did anything that ships inside the executable change
        id: gate
        if: steps.pick.outputs.todo == 'yes'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -o pipefail
          # for-each-ref rather than the porcelain listing command, which a test forbids in this file. An annotated tag names its commit in
          # *objectname and a lightweight one in objectname, so both are read.
          previous=$(git for-each-ref --sort=-creatordate --format='%(objectname) %(*objectname) %(refname:strip=2)' \
            'refs/tags/v*-nightly.*' | awk -v sha="$SHA" '{ c = ($2 ~ /^[0-9a-f]{40}$/ ? $2 : $1); n = $NF; if (c != sha) { print c, n; exit } }')
          base=$(echo "$previous" | cut -d' ' -f1)
          tag=$(echo "$previous" | cut -d' ' -f2)
          if [ -z "$base" ]; then
            echo "application-changed=yes" >> "$GITHUB_OUTPUT"
            echo "there is no earlier nightly to compare against, so this one is built"
            exit 0
          fi

          if ! out=$(python3 scripts/shipping-gate.py --decide "$base" "$SHA" 2>&1); then
            echo "$out"
            echo "::error::a changed path is in neither list in .github/shipping-paths.json. Decide which side it is on and add it."
            exit 1
          fi
          echo "$out"

          verdict=$(printf '%s\n' "$out" | head -1 | cut -d= -f2)
          echo "application-changed=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" != "yes" ]; then
            number=${tag##*-nightly.}
            echo "::notice::no application change since nightly ${number}. No build produced."
            {
              echo "### No application change since nightly ${number}. No build produced."
              echo
              echo "Everything that changed since that build is content: the website, the documentation, the release notes or the research"
              echo "articles. Content publishes through the site and never produces an executable. NOTES-FROM-PLANNING.md entry 150."
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Entry 150 section 6.3: the gate's logic exercised against the real history rather than against a fixture, every night, printed where
      # somebody reading a run can see what it would have done. It never fails the run; it is a measurement.
      - name: What the gate would have done to the last thirty nightlies
        if: steps.pick.outputs.todo == 'yes'
        continue-on-error: true
        run: |
          {
            echo "<details><summary>What the gate would have done to the last thirty nightlies</summary>"
            echo
            echo '```'
            python3 scripts/shipping-gate.py --history 30 || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Entry 150 section 2.4: nightly numbers count builds, not days, so a skipped night does not consume one. The number is the highest
      # nightly tag that exists plus one, rather than this workflow's run number, which counts every run including the ones that built
      # nothing. That is why the published numbers already jump: 14 to 16 to 18 to 25.
      - name: Work out the version
        id: name
        if: steps.pick.outputs.todo == 'yes' && steps.gate.outputs.application-changed == 'yes'
        run: |
          base=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2)
          last=$(git for-each-ref --format='%(refname:strip=2)' 'refs/tags/v*-nightly.*' | sed 's/.*-nightly\.//' | sort -n | tail -1)
          echo "version=${base}-nightly.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short ${{ steps.pick.outputs.sha }})" >> "$GITHUB_OUTPUT"

      # Entry 119 section 3.2: no key, no publishing. It fails here, before anything is built, so the reason is the first thing in the log.
      - name: The signing key must be here
        id: key
        if: steps.pick.outputs.todo == 'yes' && steps.gate.outputs.application-changed == 'yes'
        env:
          GROUPLAB_UPDATE_SIGNING_KEY: ${{ secrets.GROUPLAB_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$GROUPLAB_UPDATE_SIGNING_KEY" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            {
              echo "### no update signing key, so nothing is published"
              echo
              echo "The repository secret \`GROUPLAB_UPDATE_SIGNING_KEY\` does not exist, so this build cannot sign its update manifest."
              echo "An unsigned manifest is one the application would have to trust without being able to check it, so the nightly train"
              echo "publishes nothing until the secret is set. \`docs/UPDATES.md\` has the steps."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the repository secret GROUPLAB_UPDATE_SIGNING_KEY is not set, so this nightly cannot be signed and will not be published. See docs/UPDATES.md."
            exit 1
          fi
          echo "present=yes" >> "$GITHUB_OUTPUT"

  package:
    name: package
    needs: name-it
    # Entry 150 section 2.2: every build, test, package and release job depends on the gate.
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.name-it.outputs.sha }}
      version: ${{ needs.name-it.outputs.version }}
      train: nightly
    # Entry 306: the Developer ID and the App Store Connect key, for signing and notarizing the Mac build when they are set.
    secrets: inherit

  # NOTES-FROM-PLANNING.md entry 219 item A6: the Android application, signed with Alan's upload key, as an APK to install by hand and
  # an AAB for Google Play's internal testing track. Until the key is in the repository's secrets it builds nothing and says so, and it
  # can never hold back the desktop builds: a failure here leaves the nightly without its Android files and publishes the rest.
  # The version code is the nightly's own number, which only ever rises. The key is written to the runner's temporary folder for the
  # build and deleted after it; it is never printed and never uploaded.
  android:
    name: android, signed
    needs: name-it
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      STORE_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      VERSION: ${{ needs.name-it.outputs.version }}
    steps:
      - name: The upload key
        id: key
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "### No Android upload key yet, so this nightly has no signed Android build (request 35)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'yes'
        with:
          ref: ${{ needs.name-it.outputs.sha }}

      - name: Native library cache
        if: steps.key.outputs.present == 'yes'
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-native
          key: android-native-${{ hashFiles('android/opencv/build-extern.sh') }}

      - name: Build OpenCV and OpenCvSharp's native half
        if: steps.key.outputs.present == 'yes' && steps.cache.outputs.cache-hit != 'true'
        run: bash android/opencv/build-extern.sh "${{ runner.temp }}/android-native-work" "${{ runner.temp }}/android-native"

      - uses: actions/setup-dotnet@v5
        if: steps.key.outputs.present == 'yes'
        with:
          dotnet-version: '10.0.x'

      - name: Build the signed APK and AAB
        if: steps.key.outputs.present == 'yes'
        run: |
          set -e
          dotnet workload install android --skip-sign-check > /dev/null
          mkdir -p android/native && cp -r "${{ runner.temp }}/android-native/." android/native/
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE" | base64 -d > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          code="${VERSION##*.}"
          # Once for each: the project's AndroidPackageFormat wins over AndroidPackageFormats, so one publish makes one kind
          # (tried on this machine with a throwaway key, entry 219 item A6).
          for format in aab apk; do
            dotnet publish android/GroupLab.Android -c Release -o "$RUNNER_TEMP/android-out" \
              -p:AndroidPackageFormat=$format -p:ApplicationVersion="$code" -p:ApplicationDisplayVersion="$VERSION" -p:Version="$VERSION" \
              -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64" \
              -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias=grouplab-upload \
              -p:AndroidSigningStorePass=env:STORE_PASS -p:AndroidSigningKeyPass=env:KEY_PASS
          done
          # Entry 234: the development build, org.grouplab.app.dev, "GroupLab Dev", debuggable, installed beside the Play copy. Its version
          # ends in -dev, which marks its error and survey reports.
          dotnet publish android/GroupLab.Android -c Release -o "$RUNNER_TEMP/android-dev-out" \
            -p:GroupLabDev=true -p:AndroidPackageFormat=apk -p:ApplicationVersion="$code" -p:ApplicationDisplayVersion="$VERSION-dev" -p:Version="$VERSION-dev" \
            -p:GroupLabTrain=nightly \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias=grouplab-upload \
            -p:AndroidSigningStorePass=env:STORE_PASS -p:AndroidSigningKeyPass=env:KEY_PASS
          mkdir -p signed
          cp "$(find "$RUNNER_TEMP/android-dev-out" -name '*-Signed.apk' | head -1)" signed/grouplab-android-dev.apk
          cp "$(find "$RUNNER_TEMP/android-out" -name '*-Signed.apk' | head -1)" signed/grouplab-android.apk
          cp "$(find "$RUNNER_TEMP/android-out" -name '*-Signed.aab' | head -1)" signed/grouplab-android.aab
          # Entry 231: Play's native debug symbols for the AAB. Only GroupLab's own OpenCV library can have them; the .NET runtime's
          # libraries come already stripped, and Microsoft keeps their symbols on its own symbol server.
          if [ -d android/native/symbols ]; then
            (cd android/native/symbols && zip -qr "$GITHUB_WORKSPACE/signed/grouplab-android-native-symbols.zip" .)
          fi
          ls -l signed
          # Entry 288: the AAB goes only to Google Play and must not carry the updater. Its manifest is a protocol buffer in which the
          # permission's name is plain text, so its absence can be read without any tool; the Dev APK must carry it.
          if unzip -p signed/grouplab-android.aab base/manifest/AndroidManifest.xml | grep -aq REQUEST_INSTALL_PACKAGES; then
            echo "::error::the AAB for Google Play asks to install packages, so it carries the updater (entry 288)"
            exit 1
          fi
          if ! unzip -p signed/grouplab-android-dev.apk AndroidManifest.xml | tr -d '\0' | grep -aq REQUEST_INSTALL_PACKAGES; then
            echo "::error::GroupLab Dev's APK has no updater (entry 288)"
            exit 1
          fi
          echo "the AAB has no updater, and GroupLab Dev's APK has one"

      - uses: actions/upload-artifact@v6
        if: steps.key.outputs.present == 'yes'
        with:
          name: android-signed
          path: signed
          retention-days: 1

  # NOTES-FROM-PLANNING.md entry 290 section 2 items 3 and 7: the iPhone and iPad build in every nightly. It builds for a device with this
  # nightly's version; scripts/ios-signing.py decides from the seven Apple secrets (request 55) whether it is signed and sent to
  # TestFlight: none set builds unsigned and sends nothing, all seven right signs and uploads, and a malformed one fails naming the secret.
  # It is not among publish's needs, so the other builds are never held up by it, and it never fails for want of the secrets.
  ios:
    name: iOS, unsigned until the Apple secrets exist
    needs: name-it
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: macos-26
    timeout-minutes: 120
    continue-on-error: true
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VERSION: ${{ needs.name-it.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.name-it.outputs.sha }}

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      # The repository has no global.json; the desktop's workflows take the newest .NET 10, and so does this.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The newest iOS workload wants the Xcode after 26 (27.0.10722 refused Xcode 26.6), so the workload is held to the newest one made
      # for Xcode 26. The manifest's band is 10.0.100 whatever the SDK's band is.
      - name: The .NET iOS workload
        run: |
          ls -d /Applications/Xcode_26*.app | tr '\n' ' '; echo
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: The Apple secrets
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_SHARE_PROFILE: ${{ secrets.IOS_SHARE_PROFILE }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set +e
          python3 scripts/ios-signing.py --check
          code=$?
          set -e
          [ $code -eq 1 ] && { echo "::error::An Apple secret is malformed; the lines above name it. Nothing was signed or sent."; exit 1; }
          if [ $code -eq 3 ]; then echo "### iOS: no Apple secrets yet, so this build is not signed or sent to TestFlight (request 55)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Build for a device
        run: |
          code="${VERSION##*.}"
          dotnet build ios/GroupLab.iOS --configuration Release -r ios-arm64 \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -p:Version="$VERSION" -p:ApplicationDisplayVersion="${VERSION%%-*}" -p:ApplicationVersion="$code" -p:GroupLabTrain=nightly \
            -p:EnableCodeSigning=false -bl:build-device.binlog \
            -v:minimal -clp:ErrorsOnly > build-device.log 2>&1 || { grep -E "error" build-device.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*ios-arm64*' -not -path '*simulator*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          if [ "${{ steps.opencv.outputs.linked }}" = "true" ]; then
            nm -gU "$app/GroupLab.iOS" 2>/dev/null | grep -c " T _core_Mat_new1$" || { echo "::error::OpenCV's entry points are not in the device executable"; exit 1; }
          fi
          echo "### iOS: built for a device, $(du -sh "$app" | cut -f1), version $VERSION." >> "$GITHUB_STEP_SUMMARY"

      # Entry 292 section 2.3: the application and its share extension are each signed with their own App Store profile. The properties the
      # signed publish is given are built by scripts/ios-signing.py --properties, and this dry run proves with made-up values that MSBuild
      # gives each project its own, so the signed path is checked every night whether or not the secrets exist.
      - name: The signing properties, a dry run
        run: sh ios/signing-dry-run.sh

      # With all eight secrets right: sign with the distribution certificate and the two App Store profiles in a keychain made for this run
      # and deleted after it, and send the build to TestFlight with the App Store Connect key. No secret is ever printed.
      - name: Sign and send to TestFlight
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_SHARE_PROFILE: ${{ secrets.IOS_SHARE_PROFILE }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/grouplab-signing.keychain-db"
          kpass=$(uuidgen)
          echo "::add-mask::$kpass"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/$2.mobileprovision"
            installed=$(security cms -D -i "$RUNNER_TEMP/$2.mobileprovision" | plutil -extract UUID raw -)
            cp "$RUNNER_TEMP/$2.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$installed.mobileprovision"
            rm -f "$RUNNER_TEMP/$2.mobileprovision"
            echo "$installed"
          }
          uuid=$(install_profile "$IOS_PROFILE" grouplab)
          share_uuid=$(install_profile "$IOS_SHARE_PROFILE" grouplab-share)
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -oE '"[^"]*Distribution[^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "::error::The distribution certificate did not import as a signing identity."; exit 1; }
          code="${VERSION##*.}"
          # One argument a line from the check: the identity and each project's own profile (GroupLabAppProvision, GroupLabShareProvision).
          signing=$(python3 scripts/ios-signing.py --properties "$identity" "$uuid" "$share_uuid")
          set --
          while IFS= read -r line; do set -- "$@" "$line"; done <<EOF
          $signing
          EOF
          dotnet publish ios/GroupLab.iOS --configuration Release -r ios-arm64 \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -p:Version="$VERSION" -p:ApplicationDisplayVersion="${VERSION%%-*}" -p:ApplicationVersion="$code" -p:GroupLabTrain=nightly \
            -p:ArchiveOnBuild=true "$@" -o "$RUNNER_TEMP/ipa" \
            -v:minimal -clp:ErrorsOnly > publish-ios.log 2>&1 || { grep -E "error" publish-ios.log | head -40; exit 1; }
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          # The package carries the share extension, and each bundle its own profile.
          unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa-check"
          payload=$(ls -d "$RUNNER_TEMP"/ipa-check/Payload/*.app | head -1)
          embedded() { security cms -D -i "$1/embedded.mobileprovision" | plutil -extract UUID raw -; }
          test "$(embedded "$payload")" = "$uuid" || { echo "::error::The application is not signed with its own profile."; exit 1; }
          test -d "$payload/PlugIns/GroupLab.Share.appex" || { echo "::error::The signed package carries no share extension."; exit 1; }
          test "$(embedded "$payload/PlugIns/GroupLab.Share.appex")" = "$share_uuid" || { echo "::error::The share extension is not signed with its own profile."; exit 1; }
          # Alan, 2026-09-30: App Store Connect should ask no export question, so both bundles say they use only the system's encryption.
          # Nightlies 135 and 136 stopped here although the unsigned device build's Info.plist says false, and the check swallowed what it
          # read. So it prints what the signed package carries and warns rather than stops: scripts/testflight.py answers the question
          # through the API where Apple still asks it.
          for b in "$payload" "$payload/PlugIns/GroupLab.Share.appex"; do
            said=$(python3 -c 'import plistlib, sys; p = plistlib.load(open(sys.argv[1], "rb")); print(repr(p.get("ITSAppUsesNonExemptEncryption", "absent")), len(p), "keys")' "$b/Info.plist" 2>&1 || true)
            echo "$(basename "$b"): ITSAppUsesNonExemptEncryption is $said"
            case "$said" in
              "False "*) ;;
              *) echo "::warning::$(basename "$b") does not carry ITSAppUsesNonExemptEncryption as false ($said); the testflight workflow answers the export question." ;;
            esac
          done
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$HOME/private_keys"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          fi
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" > upload.log 2>&1 \
            || { grep -vi "key" upload.log | tail -20; echo "::error::TestFlight did not take the build; the lines above say why."; exit 1; }
          echo "### iOS: signed and sent to TestFlight, version $VERSION." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          security delete-keychain "$keychain"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-nightly-build
          path: |
            build-device.log
            build-device.binlog
          retention-days: 7

  # NOTES-FROM-PLANNING.md entry 315's amendment, section 2: GroupLab Dev for iPhone and iPad, org.grouplab.app.dev, the same sources with
  # the developer tools compiled in (-p:GroupLabDev=true). Built for a device every nightly; signed and sent to TestFlight, for the
  # internal group only, once its two profiles exist (request 61). Its own job, never a need of publish, and never failing the nightly.
  ios-dev:
    name: iOS GroupLab Dev, unsigned until its profiles exist
    needs: name-it
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: macos-26
    timeout-minutes: 120
    continue-on-error: true
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VERSION: ${{ needs.name-it.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.name-it.outputs.sha }}

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      # The repository has no global.json; the desktop's workflows take the newest .NET 10, and so does this.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The newest iOS workload wants the Xcode after 26 (27.0.10722 refused Xcode 26.6), so the workload is held to the newest one made
      # for Xcode 26. The manifest's band is 10.0.100 whatever the SDK's band is.
      - name: The .NET iOS workload
        run: |
          ls -d /Applications/Xcode_26*.app | tr '\n' ' '; echo
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      # Request 61: GroupLab Dev's two App Store profiles. Until both are set it is built unsigned and sent nowhere; a malformed one is a
      # warning, never a failure, since nothing else depends on GroupLab Dev.
      - name: GroupLab Dev's profiles
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_SHARE_PROFILE: ${{ secrets.IOS_SHARE_PROFILE }}
          IOS_DEV_PROFILE: ${{ secrets.IOS_DEV_PROFILE }}
          IOS_DEV_SHARE_PROFILE: ${{ secrets.IOS_DEV_SHARE_PROFILE }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set +e
          python3 scripts/ios-signing.py --check-dev
          code=$?
          set -e
          [ $code -eq 1 ] && echo "::warning::GroupLab Dev's profiles are not both right; the lines above say which. GroupLab Dev is built unsigned."
          if [ $code -ne 0 ]; then echo "### iOS GroupLab Dev: not signed or sent to TestFlight (request 61)." >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Build GroupLab Dev for a device
        run: |
          code="${VERSION##*.}"
          dotnet build ios/GroupLab.iOS --configuration Release -r ios-arm64 -p:GroupLabDev=true \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -p:Version="$VERSION-dev" -p:ApplicationDisplayVersion="${VERSION%%-*}" -p:ApplicationVersion="$code" -p:GroupLabTrain=nightly \
            -p:EnableCodeSigning=false -bl:build-dev-device.binlog \
            -v:minimal -clp:ErrorsOnly > build-dev-device.log 2>&1 || { grep -E "error" build-dev-device.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*ios-arm64*' -not -path '*simulator*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "org.grouplab.app.dev" || { echo "::error::GroupLab Dev is not org.grouplab.app.dev"; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$app/PlugIns/GroupLab.Share.appex/Info.plist")" = "org.grouplab.app.dev.share" || { echo "::error::GroupLab Dev's share extension has the wrong id"; exit 1; }
          echo "### iOS GroupLab Dev: built for a device, $(du -sh "$app" | cut -f1), version $VERSION-dev." >> "$GITHUB_STEP_SUMMARY"

      # With GroupLab Dev's profiles right: signed with the same certificate, sent to TestFlight with the same key. Its App Store Connect
      # record is its own, and it is given only to the internal group there (entry 315's amendment, section 2); nothing here adds it to an
      # external group. No secret is ever printed.
      - name: Sign GroupLab Dev and send it to TestFlight
        if: steps.signing.outputs.sign-dev == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_DEV_PROFILE: ${{ secrets.IOS_DEV_PROFILE }}
          IOS_DEV_SHARE_PROFILE: ${{ secrets.IOS_DEV_SHARE_PROFILE }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/grouplab-dev-signing.keychain-db"
          kpass=$(uuidgen)
          echo "::add-mask::$kpass"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/$2.mobileprovision"
            installed=$(security cms -D -i "$RUNNER_TEMP/$2.mobileprovision" | plutil -extract UUID raw -)
            cp "$RUNNER_TEMP/$2.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$installed.mobileprovision"
            rm -f "$RUNNER_TEMP/$2.mobileprovision"
            echo "$installed"
          }
          uuid=$(install_profile "$IOS_DEV_PROFILE" grouplab-dev)
          share_uuid=$(install_profile "$IOS_DEV_SHARE_PROFILE" grouplab-dev-share)
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -oE '"[^"]*Distribution[^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "::error::The distribution certificate did not import as a signing identity."; exit 1; }
          code="${VERSION##*.}"
          signing=$(python3 scripts/ios-signing.py --properties "$identity" "$uuid" "$share_uuid")
          set --
          while IFS= read -r line; do set -- "$@" "$line"; done <<EOF
          $signing
          EOF
          dotnet publish ios/GroupLab.iOS --configuration Release -r ios-arm64 -p:GroupLabDev=true \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -p:Version="$VERSION-dev" -p:ApplicationDisplayVersion="${VERSION%%-*}" -p:ApplicationVersion="$code" -p:GroupLabTrain=nightly \
            -p:ArchiveOnBuild=true "$@" -o "$RUNNER_TEMP/ipa-dev" \
            -v:minimal -clp:ErrorsOnly > publish-ios-dev.log 2>&1 || { grep -E "error" publish-ios-dev.log | head -40; exit 1; }
          ipa=$(ls "$RUNNER_TEMP"/ipa-dev/*.ipa | head -1)
          mkdir -p "$HOME/private_keys"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          fi
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" > upload.log 2>&1 \
            || { grep -vi "key" upload.log | tail -20; echo "::error::TestFlight did not take GroupLab Dev; the lines above say why."; exit 1; }
          echo "### iOS GroupLab Dev: signed and sent to TestFlight, version $VERSION-dev." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          security delete-keychain "$keychain"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-dev-nightly-build
          path: |
            build-dev-device.log
            build-dev-device.binlog
          retention-days: 7

  # Entry 342, worker A item 2: the iOS simulator's checks (ios-app.yml: the self-test, GroupLab Dev's scenario and the screen sweep), started
  # for every nightly that changes the application. Started rather than called, so its result is its own run and never colors the nightly
  # or holds up publishing; the repository is public, so its macOS minutes are not billed, and it runs beside the nightly's own jobs.
  ios-simulator:
    name: start the iOS simulator checks
    needs: name-it
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start ios-app.yml on main
        run: gh workflow run ios-app.yml -R "$GITHUB_REPOSITORY" --ref main

  # Entry 352 item 1: the same screen sweep on an Android emulator (android-emulator.yml), started the same way and for the same nightlies,
  # so its result is its own run and never holds up publishing.
  android-emulator:
    name: start the Android emulator sweep
    needs: name-it
    if: needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start android-emulator.yml on main
        run: gh workflow run android-emulator.yml -R "$GITHUB_REPOSITORY" --ref main

  publish:
    name: publish the nightly
    needs: [name-it, package, android]
    # Entry 150 section 2.2: every build, test, package and release job depends on the gate. Entry 219 item A6: the Android job's result
    # is never a condition, so a failure there publishes the desktop builds without the Android files.
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.name-it.outputs.fresh == 'yes' && needs.name-it.outputs.application-changed == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.name-it.outputs.sha }}
      VERSION: ${{ needs.name-it.outputs.version }}
      COMMIT: ${{ needs.name-it.outputs.commit }}
    steps:
      # The whole history, so the notes can say what has changed since the previous nightly.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.name-it.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v6
        with:
          path: assets

      # NOTES-FROM-PLANNING.md entry 147 section 5.3: a macOS build that fails to package must not take the Windows and Linux ones
      # down with it, and the run must say which one is missing rather than publishing a shorter list quietly. So the builds people
      # actually run are required by name, and the untested ones are counted and reported.
      - name: Gather the assets
        run: |
          set -o pipefail
          mkdir -p release
          find assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          # Entry 219 item A6: the signed Android files, where the upload key has made them. Never required.
          find assets -type f \( -name 'grouplab-android.apk' -o -name 'grouplab-android.aab' -o -name 'grouplab-android-dev.apk' \) -exec cp {} release/ \;
          # Named like the other builds on the numbered release, so a bug report names one; the plain names go on the rolling release.
          # Entry 224: nightly 109 built and gathered them, and neither upload list below carried them.
          for ext in apk aab; do
            if [ -f "release/grouplab-android.$ext" ]; then cp "release/grouplab-android.$ext" "release/grouplab-$VERSION-android-$COMMIT.$ext"; fi
          done
          if [ -f release/grouplab-android-dev.apk ]; then cp release/grouplab-android-dev.apk "release/grouplab-$VERSION-android-dev-$COMMIT.apk"; fi
          # Entry 231: the symbols belong to exactly one AAB, so they go on the numbered release only.
          if [ -f release/grouplab-android-native-symbols.zip ]; then
            mv release/grouplab-android-native-symbols.zip "release/grouplab-$VERSION-android-native-symbols-$COMMIT.zip"
          fi
          ls -la release

          missing=""
          for needed in grouplab-setup-win-x64.exe grouplab-win-x64.zip grouplab-linux-x64.tar.gz; do
            test -f "release/$needed" || missing="$missing $needed"
          done
          if [ -n "$missing" ]; then
            echo "::error::these supported builds did not package, so this nightly is not published:$missing"
            exit 1
          fi

          absent=""
          for optional in grouplab-macos-arm64.tar.gz grouplab-macos-x64.tar.gz; do
            if [ ! -f "release/$optional" ]; then
              absent="$absent $optional"
              echo "::warning::$optional did not package; the rest of the nightly is published without it"
            fi
          done
          if [ -n "$absent" ]; then
            echo "MISSING_BUILDS=$absent" >> "$GITHUB_ENV"
            {
              echo "### macOS builds missing from this nightly"
              echo
              echo "$absent"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # What changed since the previous published build on this train, and nothing older.
      #
      # NOTES-FROM-PLANNING.md entry 138 section 2. This used to start from the rolling `nightly` tag, which moves: a run reading it could
      # see itself or an older build depending on when it looked. The per-build `v<version>-nightly.N` tags do not move, so the script finds
      # the newest one below this build itself. A nightly that was cancelled or skipped never got a tag, so its changes roll into this one,
      # which is what section 1 asks for. The tags have to be in the checkout for that, hence the fetch.
      - name: Write the notes
        run: |
          git fetch --quiet --tags origin 2>/dev/null || true
          python3 scripts/release-notes.py "$VERSION" "$SHA" > notes.md
          cat notes.md
          # Entry 139 section 3: each recent build's own notes, so the update bar can show somebody everything they skipped. They ride in
          # the second manifest format only, where a field an older build does not know is a field it ignores.
          python3 scripts/release-notes.py --versions versions.json "$VERSION" "$SHA"

      # Entry 145 section 3.3. The generator no longer hides a commit with no note in a count: it writes a line from the subject
      # instead. This is the other half of that, naming those commits in the build's own report, so a forgotten note is noticed on
      # the day by the person who wrote the commit rather than months later by somebody reading the website. It reports and does
      # not fail, because a note can be improved after a build and a build cannot be un-published.
      - name: Name any commit that wrote its own note
        run: |
          python3 scripts/release-notes.py --missing "$VERSION" "$SHA" | tee missing.txt
          {
            echo "### Notes written from a commit subject"
            echo
            echo "```"
            cat missing.txt
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"


      # The manifest: what this build is, what it offers, and the SHA-256 of every file, signed so the application can tell it from a forgery.
      - name: Write and sign the manifest
        env:
          GROUPLAB_UPDATE_SIGNING_KEY: ${{ secrets.GROUPLAB_UPDATE_SIGNING_KEY }}
        run: |
          set -o pipefail
          dotnet build src/GroupLab.Cli --configuration Release
          base="https://github.com/oRAirwolf/grouplab/releases/download/nightly"
          # Entry 347: the store-bought fingerprint library, signed with the same key, listed in the manifest beside the downloads so the
          # application reaches it on its regular check and knows its SHA-256 before it reads it.
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- target-reference library release/grouplab-target-library.json
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-manifest \
            --version "$VERSION" --train nightly --commit "$SHA" --notes notes.md --versions versions.json \
            --out release/update-manifest.json \
            --asset windows installer release/grouplab-setup-win-x64.exe "$base/grouplab-setup-win-x64.exe" \
            --asset windows zip release/grouplab-win-x64.zip "$base/grouplab-win-x64.zip" \
            --asset linux tarball release/grouplab-linux-x64.tar.gz "$base/grouplab-linux-x64.tar.gz" \
            --asset library targets release/grouplab-target-library.json "$base/grouplab-target-library.json" \
            $( [ -f release/grouplab-android-dev.apk ] && echo --asset android apk-dev release/grouplab-android-dev.apk "$base/grouplab-android-dev.apk" )
          # Checked with the key compiled into the build being published, not with the key that signed it: that is the stronger question,
          # because a build that cannot verify its own updates is broken however well the manifest was signed. A commit from before the key
          # was set fails here by design, and the message says NoKey.
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-check release/update-manifest.json
          dotnet run --project src/GroupLab.Cli --configuration Release --no-build -- update-check release/update-manifest-2.json

      # Entry 168 section 5, amending entry 147 section 3.2: a release carrying a macOS asset carries ONE line, generated from
      # docs/PLATFORM-SUPPORT.md's lead sentences, with the address of the download page where the whole statement is always
      # current. The whole statement used to go here, and a published release is frozen, so every copy went stale the day the
      # statement changed; nightly 94's was false when it was published.
      - name: The platform line, on a release that carries a Mac build
        run: |
          set -o pipefail
          if ls release/grouplab-macos-*.tar.gz >/dev/null 2>&1; then
            {
              echo
              python3 scripts/platform-support.py --release
            } >> notes.md
            echo "the platform line is on this release, because it carries a macOS build"
          else
            echo "no macOS asset, so the platform statement is not on this release"
          fi

      # The build's own release, which keeps the versioned assets so a bug report names something that still exists.
      # GH_DEBUG=api is here because entry 123 section 1 step 3 asks for the exact request and response when this 403s, and it did again on
      # 2026-09-21 with the repository default already set to write, no rulesets and no tag protection. It prints headers and status, never
      # the token, which the runner masks.
      - name: Publish this build
        env:
          GH_DEBUG: api
        run: |
          gh release create "v$VERSION" \
            --title "GroupLab $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --target "$SHA" \
            release/update-manifest.json release/update-manifest-2.json release/grouplab-target-library.json release/grouplab-*-win-x64-*.exe release/grouplab-*-win-x64-*.zip release/grouplab-*-linux-x64-*.tar.gz $(ls release/grouplab-*-macos-*-*.tar.gz 2>/dev/null || true) $(ls release/grouplab-*-android-*.apk release/grouplab-*-android-*.aab release/grouplab-*-android-native-symbols-*.zip 2>/dev/null || true)

      # The rolling release the README links to. The tag moves to the tested commit and the old assets go with the old release, so a fixed
      # address never serves a stale file.
      #
      # Entry 185 section 1: it is needed, because the updater reads its manifest from this release's fixed address and the download page
      # and README link its stable asset names. But it looked like a second copy of the build it points at, with the same title shape and
      # the same notes. So it is named for what it is, and its body is one line pointing at the numbered release, which carries the notes
      # and the platform line; nothing here can go stale.
      - name: Move the nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          echo "The newest build, **$VERSION**. Its notes, the platform statement and its versioned downloads are on [GroupLab $VERSION](https://github.com/oRAirwolf/grouplab/releases/tag/v$VERSION). This release moves to every new build, so its download addresses never change." > rolling.md
          gh release create nightly \
            --title "Latest nightly (always the newest build, moves with every build)" \
            --notes-file rolling.md \
            --prerelease \
            --target "$SHA" \
            release/update-manifest.json release/update-manifest-2.json release/grouplab-target-library.json release/grouplab-setup-win-x64.exe release/grouplab-win-x64.zip release/grouplab-linux-x64.tar.gz $(ls release/grouplab-macos-*.tar.gz 2>/dev/null || true) $(ls release/grouplab-android.apk release/grouplab-android.aab release/grouplab-android-dev.apk 2>/dev/null || true)

      # 2026-10-01: nightly 148's run printed the moving release's address and left it a draft, so every download button on the site and in
      # the README answered 404 until it was published by hand. Publish it if it is still a draft, then prove a download answers.
      - name: The moving release is published and downloads
        run: |
          for attempt in 1 2 3; do
            if [ "$(gh release view nightly --json isDraft --jq .isDraft)" = "true" ]; then
              echo "::warning::the moving nightly release was left a draft; publishing it"
              gh release edit nightly --draft=false
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/update-manifest.json")
            if [ "$code" = "200" ]; then
              echo "the moving release downloads"
              exit 0
            fi
            echo "attempt $attempt: a download from the moving release answered $code"
            sleep 20
          done
          echo "::error::a download from the moving nightly release still fails; the site's download buttons are broken"
          exit 1

      # Entry 119 section 2.4: keep the newest 30 nightly releases and delete older ones with their tags. Only releases this workflow made,
      # matched by the shape of their tag, are ever touched: a beta, a release, or anything else is left alone.
      - name: Keep the newest thirty
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            | python3 -c "
          import json, re, subprocess, sys
          shape = re.compile(r'^v\d+\.\d+\.\d+-nightly\.\d+$')
          nightlies = [r['tagName'] for r in json.load(sys.stdin) if shape.match(r['tagName']) and r['isPrerelease']]
          nightlies.sort(key=lambda t: int(t.rsplit('.', 1)[1]), reverse=True)
          for tag in nightlies[30:]:
              print('removing ' + tag)
              subprocess.run(['gh', 'release', 'delete', tag, '--yes', '--cleanup-tag'], check=False)
          print(str(min(len(nightlies), 30)) + ' nightly releases kept')
          "

      # Entry 144 section 2: the notes write themselves. The generated entry is the floor, not the ceiling; improving its wording later is
      # an ordinary site content commit.
      #
      # The loop is guarded by the marker in the commit subject, which ci.yml and this workflow both skip on. That push does match
      # website.yml's paths filter, which is the point: the releases page follows within a couple of minutes without anybody asking.
      # Entry 144 section 2: the notes write themselves. The generated entry is the floor, not the ceiling; improving its wording later is
      # an ordinary site content commit.
      #
      # The loop is guarded by the marker in the commit subject, which ci.yml and this workflow both skip on. That push does match
      # website.yml's paths filter, which is the point: the releases page follows within a couple of minutes without anybody asking.
      - name: Write this build's notes into docs/RELEASE-NOTES.md
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          # Entry 185: the thirty-release rule above deleted the oldest releases and their tags; their entries stop linking to them.
          git fetch --quiet --tags --prune --prune-tags origin
          python3 scripts/release-notes.py --mark-gone
          if [ -n "$(git status --porcelain -- docs/RELEASE-NOTES.md)" ]; then
            git add docs/RELEASE-NOTES.md
            git commit -m "[notes] The builds the thirty-release rule removed" -m "Their entries no longer link to releases that are gone, NOTES-FROM-PLANNING.md entry 185."
          fi

          if grep -q "^## $VERSION$" docs/RELEASE-NOTES.md; then
            echo "$VERSION is already in the file, so nothing is appended."
            git push origin main
            exit 0
          fi

          python3 scripts/release-notes.py "$VERSION" "$SHA" > body.md
          python3 - "$VERSION" "$SHA" <<'PY'
          import io, sys, datetime
          version, sha = sys.argv[1], sys.argv[2]
          nl = chr(10)
          body = io.open('body.md', encoding='utf-8').read()
          # The generator's first line names the build; the file's own heading does that, so it is not repeated.
          lines = [l for l in body.splitlines() if not l.startswith('GroupLab ')]
          entry = [
              '## ' + version,
              '',
              '**' + datetime.date.today().isoformat() + '**, commit `' + sha[:7] + '`. Nightly.',
              '',
              nl.join(lines).strip(),
              '',
              '[Downloads for this build](https://github.com/oRAirwolf/grouplab/releases/tag/v' + version + ')',
              '',
              '---',
              '',
              '',
          ]
          path = 'docs/RELEASE-NOTES.md'
          text = io.open(path, encoding='utf-8', newline='').read()
          # Newest first, directly under the horizontal rule that closes the file's preamble.
          rule = nl + '---' + nl
          at = text.index(rule) + len(rule)
          io.open(path, 'w', encoding='utf-8', newline='').write(text[:at] + nl + nl.join(entry) + text[at:].lstrip(nl))
          PY

          rm -f body.md
          git add docs/RELEASE-NOTES.md
          git commit -m "[notes] $VERSION" -m "Written by the nightly from this build's Release-note trailers, NOTES-FROM-PLANNING.md entry 144 section 2."
          git push origin main
          echo "appended $VERSION and pushed it; website.yml's paths filter picks it up"

      # NOTES-FROM-PLANNING.md entry 244: the README's generated sections, the newest build, what is new, the feature list and the plan,
      # rewritten from the notes just written and committed as a [notes] commit, only when something changed. The marker in the subject
      # keeps the loop closed, as for the release notes above.
      - name: Bring the README up to date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          python3 scripts/readme.py --write
          if [ -n "$(git status --porcelain -- README.md)" ]; then
            git add README.md
            git commit -m "[notes] README for $VERSION" -m "Its generated sections, rewritten by the nightly, NOTES-FROM-PLANNING.md entry 244."
            git push origin main || { git pull --rebase --quiet origin main && git push origin main; }
          fi

      # NOTES-FROM-PLANNING.md entry 184: the build announces itself in #builds, only now that it is published, with the same notes as
      # the release body from the same generator, less the platform line. The webhook is a repository secret Alan added; without it the
      # step says so and posts nothing, and nothing here can fail the build. .github/announced-builds.txt records the version once it
      # is posted, so a rerun of this workflow does not post it twice.
      - name: Announce the build in Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK: ${{ secrets.DISCORD_BUILDS_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_BUILDS_WEBHOOK" ]; then echo "::add-mask::$DISCORD_BUILDS_WEBHOOK"; fi
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          python3 scripts/release-notes.py "$VERSION" "$SHA" > announce.md
          { echo "### Discord"; echo; python3 scripts/discord-announce.py "$VERSION" announce.md; } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f announce.md
          if [ -n "$(git status --porcelain -- .github/announced-builds.txt)" ]; then
            git add .github/announced-builds.txt
            git commit -m "[notes] Announced $VERSION" -m "Recorded by the nightly so a rerun does not post it twice, NOTES-FROM-PLANNING.md entry 184."
            git push origin main || { git pull --rebase --quiet origin main && git push origin main; }
          fi

      - name: Say what it is
        run: |
          {
            echo "### nightly $VERSION"
            echo
            echo "https://github.com/oRAirwolf/grouplab/releases/tag/nightly"
            echo
            for f in release/*; do
              echo "- $(basename "$f"), $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
