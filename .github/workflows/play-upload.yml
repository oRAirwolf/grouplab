name: play upload

# NOTES-FROM-PLANNING.md entry 384 section 3: each nightly's Android App Bundle and its native symbols go to Google Play's internal
# testing track, and from entry 487 section 1 to its closed track (alpha) too, so testers who installed GroupLab from Play are kept up
# to date. The closed track is sent only when its newest release is completed, and nothing is sent while Google reviews earlier
# changes (scripts/play-upload.py says why). It runs after a nightly has published, or by hand for
# a given version, and does nothing while the repository secret PLAY_SERVICE_ACCOUNT_JSON is absent (request 80: a Google Cloud service
# account with release rights on this app only, its JSON key added by Alan). It never holds up or fails a nightly.
on:
  workflow_run:
    workflows: [nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to send, such as 0.2.0-nightly.176; the newest numbered nightly when empty'
        required: false
        default: ''
      read_only:
        description: 'Only read the tracks and the store listing, change nothing'
        type: boolean
        required: false
        default: false

# Entry 513: production too, the closed track's newest reviewed release, from the first night Google allows it; until then one dated
# "blocked" line a day in docs/notes/external-status.md. STORE_SUBMISSIONS_PAUSED (repository variable or file) stops every send.
permissions:
  contents: write

concurrency:
  group: play-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      WANTED: ${{ inputs.version }}
      PAUSED: ${{ vars.STORE_SUBMISSIONS_PAUSED }}
    steps:
      - uses: actions/checkout@v5

      - name: Skipped without the service account, or while store submissions are paused
        id: key
        run: |
          if [ "$PAUSED" = "true" ] || [ -e STORE_SUBMISSIONS_PAUSED ]; then
            echo "### STORE_SUBMISSIONS_PAUSED is set, so nothing is sent to Google Play" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "### No PLAY_SERVICE_ACCOUNT_JSON yet (request 80), so nothing is sent to Google Play" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the tracks and the listing, changing nothing
        if: steps.key.outputs.present == 'true' && inputs.read_only
        run: |
          pip install --quiet google-auth requests
          python3 scripts/play-upload.py --read-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The nightly's bundle and symbols
        if: steps.key.outputs.present == 'true' && !inputs.read_only
        id: files
        run: |
          set -eu
          version="${WANTED:-$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '[.[] | select(.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+-nightly[.]"))][0].tagName' | sed 's/^v//')}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p play
          gh release download "v$version" -R "$GITHUB_REPOSITORY" -p "grouplab-$version-android-*.aab" -p "grouplab-$version-android-native-symbols-*.zip" -D play
          ls -l play

      - name: Send to the internal and closed testing tracks
        if: steps.key.outputs.present == 'true' && !inputs.read_only
        env:
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -eu
          pip install --quiet google-auth requests
          aab=$(ls play/*.aab | head -1)
          symbols=$(ls play/*native-symbols*.zip 2>/dev/null | head -1 || true)
          python3 scripts/play-upload.py --aab "$aab" ${symbols:+--symbols "$symbols"} --version "$VERSION" --tracks internal,alpha | tee -a "$GITHUB_STEP_SUMMARY"

      # Entry 513: production, after the closed track; never fails the run.
      - name: Send the closed track's newest reviewed release to production
        if: steps.key.outputs.present == 'true' && !inputs.read_only
        continue-on-error: true
        run: |
          pip install --quiet google-auth requests
          python3 scripts/play-upload.py --production | tee production.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note production's state
        if: steps.key.outputs.present == 'true' && !inputs.read_only
        continue-on-error: true
        run: |
          [ -s production.txt ] || exit 0
          python3 scripts/status-note.py --section play < production.txt > said.txt
          grep -q '^changed' said.txt || { echo "the state is as it was"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notes/external-status.md
          git commit -m "[notes] External status: Google Play production" -m "Written by the play upload workflow, entry 513."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::the changed state could not be pushed; the next run tries again"
