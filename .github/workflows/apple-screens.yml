name: apple screens

# NOTES-FROM-PLANNING.md entry 487 section 4: the App Store screenshots, taken on the iOS simulators rather than padded from Android's,
# so App Store review sees the iPhone and iPad as they are. Run by hand. GroupLab Dev is built from the newest TestFlight build's source
# (the newest v0.* tag unless a ref is given) on macos-26 with Xcode 26, the toolchain that build was made with, and walks
# scripts/scenarios/phone-screens.json, the walk the Play pictures come from, on an iPhone 6.9 inch and an iPad 13 inch simulator in the
# dark theme with the status bar at 9:41 and full. scripts/apple-screens.py fits the seven places of the Play set to App Store Connect's
# exact sizes; the pictures are committed to docs/store/apple/ with made-from.json, then uploaded to version 1.0's English (U.S.)
# screenshot sets if `upload` is set. Nothing here attaches a build or submits for review.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The tag or commit to build, such as v0.2.0-nightly.225; the newest v0.* tag when empty'
        required: false
        default: ''
      upload:
        description: 'Upload the committed pictures to App Store Connect afterwards'
        type: boolean
        required: false
        default: true
      upload_only:
        description: 'Take no pictures: only upload those already committed in docs/store/apple'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: apple-screens
  cancel-in-progress: false

jobs:
  shots:
    name: The simulators' screenshots
    if: ${{ !inputs.upload_only }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GH_TOKEN: ${{ github.token }}
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Which source
        id: ref
        run: |
          ref="${{ inputs.ref }}"
          [ -n "$ref" ] || ref=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '[.[] | select(.tagName | startswith("v0."))][0].tagName')
          test -n "$ref" || { echo "::error::No v0.* release to take the source from"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Source: $ref" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # The fitting script comes from main, whatever the source being photographed.
      - name: The fitting script from main
        run: |
          git fetch --depth 1 origin main
          git show FETCH_HEAD:scripts/apple-screens.py > "$RUNNER_TEMP/apple-screens.py"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          xcodebuild -version | head -1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: The .NET iOS workload
        run: |
          dotnet workload config --update-mode manifests > /dev/null
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json" > workload.log 2>&1 || { tail -40 workload.log; exit 1; }
          dotnet workload list | grep -i ios

      # The workflow ios keeps the framework in a cache, made on main for each version of its build script and so seen by every branch;
      # where there is none for this version, the newest successful run's artifact is taken instead.
      - name: OpenCV for iOS from the cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-opencv
          key: ios-opencv-${{ hashFiles('ios/opencv/build-extern.sh') }}

      - name: OpenCV for iOS
        id: opencv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="cache"
          if [ ! -f "$RUNNER_TEMP/ios-opencv/OpenCvSharpExtern.xcframework.zip" ]; then
            run=""
            for branch in main ios/opencv; do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n ios-opencv -D "$RUNNER_TEMP/ios-opencv" || run=""
          fi
          if [ -z "$run" ]; then
            echo "::notice::No OpenCV for iOS yet (no successful run of the workflow ios with the artifact ios-opencv). The head is built without it and the imaging checks are skipped."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/ios-opencv"
          shasum -a 256 -c OpenCvSharpExtern.xcframework.zip.sha256
          mkdir -p "$GITHUB_WORKSPACE/ios/native"
          unzip -q OpenCvSharpExtern.xcframework.zip -d "$GITHUB_WORKSPACE/ios/native"
          ls "$GITHUB_WORKSPACE/ios/native/OpenCvSharpExtern.xcframework"
          # The entry points the link must keep, from OpenCvSharp's own assembly, which the restore puts in the package folder.
          cd "$GITHUB_WORKSPACE"
          dotnet restore ios/GroupLab.iOS -v:q > /dev/null
          assembly=$(ls "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/opencvsharp4/*/lib/net8.0/OpenCvSharp.dll | tail -1)
          python3 ios/opencv-symbols.py ios/native/OpenCvSharpExtern.xcframework "$assembly" ios/native/OpenCvSharpExtern.symbols.props
          xcrun nm -gUm ios/native/OpenCvSharpExtern.xcframework/ios-arm64-simulator/libOpenCvSharpExtern.a 2>/dev/null | grep -E " _vector_Point2f_(delete|new1)$" || echo "vector_Point2f_delete is not defined in the simulator archive"
          cd "$RUNNER_TEMP/ios-opencv"
          # link-frameworks.txt names "-framework X", "libY.tbd" and "-lZ" lines; the head takes frameworks and linker flags apart.
          frameworks=$(grep -oE -- '-framework [A-Za-z]+' link-frameworks.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
          flags=$( (grep -oE 'lib[a-z0-9+]+\.tbd' link-frameworks.txt | sed -E 's/^lib(.*)\.tbd$/-l\1/'; grep -oE -- '^-l[a-z0-9+]+' link-frameworks.txt) | sort -u | tr '\n' ' ')
          echo "OpenCV for iOS from run $run: $(cut -d' ' -f1 OpenCvSharpExtern.xcframework.zip.sha256)"
          echo "frameworks: $frameworks"
          echo "linker flags: $flags"
          echo "linked=true" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # One space between names and none at either end: an empty name reached the native link as an empty path and stopped it.
          echo "frameworks=$(printf '%s\n' Accelerate CoreFoundation CoreGraphics Foundation $frameworks | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "flags=$(printf '%s\n' $flags | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: Build GroupLab Dev for the simulator
        run: |
          dotnet build ios/GroupLab.iOS --configuration Release -r iossimulator-arm64 -p:GroupLabDev=true \
            -p:GroupLabOpenCvFrameworks="${{ steps.opencv.outputs.frameworks }}" -p:GroupLabOpenCvLinkerFlags="${{ steps.opencv.outputs.flags }}" \
            -v:minimal -clp:ErrorsOnly > build.log 2>&1 || { grep -E "error" build.log | head -60; exit 1; }
          app=$(find ios/GroupLab.iOS/bin/Release -path '*iossimulator-arm64*' -name 'GroupLab.iOS.app' -type d | head -1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: The walk on an iPhone 6.9 inch and an iPad 13 inch
        timeout-minutes: 60
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          found = [(runtime, d["name"], d["udid"]) for runtime, ds in devices.items() if "iOS-26" in runtime for d in ds
                   if (want == "iphone" and d["name"].startswith("iPhone") and "Pro Max" in d["name"])
                   or (want == "ipad" and d["name"].startswith("iPad Pro") and "13-inch" in d["name"])]
          found.sort()
          print(found[-1][2] + " " + found[-1][1] if found else "")' "$1"
          }
          failed=0
          for device in iphone ipad; do
            found=$(pick $device)
            test -n "$found" || { xcrun simctl list devices available; echo "::error::No $device simulator of the size App Store Connect asks for"; exit 1; }
            udid=${found%% *}
            echo "$device: ${found#* }" | tee -a devices.txt
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b > /dev/null
            xcrun simctl ui "$udid" appearance dark
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" org.grouplab.app.dev
            sleep 15
            xcrun simctl terminate "$udid" org.grouplab.app.dev || true
            folder="$(xcrun simctl get_app_container "$udid" org.grouplab.app.dev data)/Documents/scenario"
            rm -rf "$folder"; mkdir -p "$folder"
            cp samples/gl-cf25-ltr-d-25-shots-600-dpi.png "$folder/sample.png"
            cp scripts/scenarios/stand-in-poster.jpg "$folder/stand-in-poster.jpg"
            cp scripts/scenarios/phone-screens.json "$folder/scenario.json"
            xcrun simctl launch --console-pty "$udid" org.grouplab.app.dev > "console-$device.log" 2>&1 &
            start=$(date +%s); status=""
            while [ $(( $(date +%s) - start )) -lt 1500 ]; do
              status=$(cat "$folder/results/status" 2>/dev/null || true)
              [ "$status" = "done" ] && break
              sleep 5
            done
            echo "$device: ${status:-no status} after $(( $(date +%s) - start )) s"
            xcrun simctl terminate "$udid" org.grouplab.app.dev || true
            mkdir -p "results/$device"
            cp -R "$folder/results/." "results/$device/" 2>/dev/null || true
            python3 "$RUNNER_TEMP/apple-screens.py" fit "results/$device" "$device" "apple/$device" || failed=1
            xcrun simctl shutdown "$udid" || true
          done
          [ "$failed" = 0 ] || { echo "::error::A device gave none of the seven places"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-screens
          path: |
            apple
            results
            devices.txt
            console-*.log
          retention-days: 14

  commit:
    name: Commit, then upload
    needs: shots
    if: ${{ always() && (needs.shots.result == 'success' || inputs.upload_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.upload_only }}
        with:
          name: apple-screens
          path: ${{ runner.temp }}/apple-screens

      - name: Commit the pictures
        if: ${{ !inputs.upload_only }}
        env:
          REF: ${{ needs.shots.outputs.ref }}
        run: |
          set -eu
          from="$RUNNER_TEMP/apple-screens"
          for device in iphone ipad; do
            mkdir -p "docs/store/apple/$device"
            rm -f docs/store/apple/$device/[0-9][0-9]-*.png
            cp "$from/apple/$device/"[0-9][0-9]-*.png "docs/store/apple/$device/" 2>/dev/null || true
          done
          python3 scripts/apple-screens.py made-from "$from" "$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/store/apple
          if git diff --cached --quiet -- docs/store/apple; then
            echo "The pictures are the same as those committed." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "[screens] the App Store screenshots, from the iOS simulators" -m "Entry 487 section 4, from $REF. Pictures only: nothing a build reads has changed."
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
            echo "Committed $(ls docs/store/apple/*/[0-9][0-9]-*.png | wc -l) pictures to docs/store/apple." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to App Store Connect
        if: ${{ inputs.upload || inputs.upload_only }}
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          python -m pip install --quiet --disable-pip-version-check "pyjwt[crypto]==2.10.1"
          python3 scripts/apple-screens.py upload | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
