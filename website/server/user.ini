; ---------------------------------------------------------------------------
; grouplab.org PHP overrides, NOTES-FROM-PLANNING.md entry 129 section 7.1.
; Install as: /home/airwolf/web/grouplab.org/public_html/.user.ini
;
; These are the settings the target upload receiver needs. PHP's defaults
; reject ordinary phone photographs, and they do it quietly enough that the
; page looks like it is working.
;
; .user.ini rather than the PHP-FPM pool file, because HestiaCP regenerates
; pool files on a template rebuild and a direct edit of one does not survive.
; PHP re-reads this file every 300 seconds by default (user_ini.cache_ttl), so
; a change takes up to five minutes, or is immediate after a php8.3-fpm reload.
;
; This file is NOT part of the built site. grouplab-site-sync.py excludes it
; from its rsync --delete for exactly that reason: without the exclusion the
; first sync after the installer ran would delete it, and the only symptom
; would be every real photograph failing to upload with nothing saying why.
; ---------------------------------------------------------------------------

; 30 MB a file, which is what the page says and what the receiver enforces.
upload_max_filesize = 30M

; The whole multipart post: 90 MB of photos plus form fields and MIME
; overhead. Kept under Cloudflare's 100 MB request body ceiling on Free and
; Pro plans, which no server side setting can raise.
post_max_size = 96M

; Uploads stream to temporary files rather than into memory, so this does not
; need to exceed post_max_size. It is raised because the receiver hashes each
; stored file and writes meta.json.
memory_limit = 256M

; A 90 MB post over mobile data is slow. max_input_time covers receiving and
; parsing the request, max_execution_time covers the script after that. The
; receiver also makes one outbound call to Cloudflare to verify the Turnstile
; token, with its own eight second timeout, well inside these.
max_input_time = 300
max_execution_time = 300

; The receiver never decodes an image, so nothing here needs a larger stack or
; a longer GD limit: rebuilding from pixels is the worker's job, and the worker
; is a systemd service with its own limits, not PHP.
;
; max_file_uploads is deliberately absent. It is PHP_INI_SYSTEM and cannot be
; set from .user.ini. PHP's default is 20, which already covers the 10 file
; limit the receiver enforces.
